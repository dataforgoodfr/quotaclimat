# Action composite réutilisable : regroupe les étapes communes à tous les
# jobs du pipeline (install, test, lint, security-scan) pour ne pas les
# recopier 4 fois dans ci.yml. Utilisation : `uses: ./.github/actions/setup`
name: Setup Python and Poetry
description: Checkout, setup Python, install Poetry, and restore the venv cache

inputs:
  python-version:
    required: true
  poetry-version:
    required: true

runs:
  using: composite
  steps:
    # 1) Installe la version de Python demandée sur le runner
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # 2) Installe Poetry (le gestionnaire de dépendances du projet)
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true # crée le venv dans ./.venv (facilite le cache ci-dessous)

    # 3) Réutilise le venv d'un run précédent si poetry.lock n'a pas changé
    #    -> évite de retélécharger toutes les dépendances à chaque run
    - name: Restore cached dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

    # 4) Installe les dépendances manquantes (rien à faire si le cache a tout restauré)
    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction
