name: Test brand groups job from a branch

# Runs the brand groups enrichment job (s05_enrichment/e01_brand_groups) with the code of a branch, on the
# production Scaleway job. Dry run or not is set by the env variable BRAND_GROUPS_DRY_RUN of the job in
# Scaleway (true: nothing written to the sheet, the proposed rows printed in the job logs). The production
# image and startup command of the job are always restored at the end.

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'quotaclimat/data_ingestion/advertising/s05_enrichment/**'
      - 'entrypoints/advertising_brand_groups_enrichment.sh'
      - '.github/workflows/advertising-brand-groups-test.yml'
  workflow_dispatch:
    inputs:
      max_brands:
        description: 'Brands processed by the test run'
        default: '20'

# the GITHUB_TOKEN only reads the repository (checkout); Scaleway is reached with its own secrets
permissions:
  contents: read

# one test at a time on the production job: two branches must not swap each other's image
concurrency:
  group: advertising-brand-groups-production-job
  cancel-in-progress: false

env:
  TEMP_IMAGE_NAME: quotaclimat-brand-group-enrichment-temp
  MAX_BRANDS: ${{ github.event.inputs.max_brands || '20' }}
  ENTRYPOINT: ./entrypoints/advertising_brand_groups_enrichment.sh

jobs:
  test-brand-groups-job:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      # feat/my_feature -> feat-my-feature-<short sha>
      - name: Image tag
        id: tag
        run: |
          SANITIZED=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g' | cut -c1-100)
          echo "value=${SANITIZED}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # the base image, as in production (no media tools needed by this job)
      - name: Build and push the temporary image
        run: |
          IMAGE=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/${{ env.TEMP_IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          docker build -f Dockerfile . -t "$IMAGE"
          docker push "$IMAGE"

      - name: Setup Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-organization-id: ${{ secrets.SCW_ORGANIZATION_ID }}
          # the default project of an organization has the organization's id
          default-project-id: ${{ secrets.SCW_ORGANIZATION_ID }}

      # jobs are regional: fr-par-1 -> fr-par
      - name: Scaleway region
        id: region
        run: echo "value=$(echo '${{ secrets.SCW_ZONE }}' | sed 's/-[0-9]*$//')" >> $GITHUB_OUTPUT

      - name: Point the job to the temporary image
        id: update
        run: |
          # the number of brands comes from the manual run form: a number only
          if ! [[ "$MAX_BRANDS" =~ ^[0-9]+$ ]]; then echo "Error: max_brands must be a number"; exit 1; fi
          scw jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_BRAND_GROUPS_ENRICHMENT }} \
            region=${{ steps.region.outputs.value }} \
            image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/${{ env.TEMP_IMAGE_NAME }}:${{ steps.tag.outputs.value }} \
            startup-command.0=env \
            "startup-command.1=BRAND_GROUPS_MAX_BRANDS=$MAX_BRANDS" \
            startup-command.2=${{ env.ENTRYPOINT }} > /dev/null

      - name: Run the job and wait for it
        id: run
        run: |
          RUN=$(scw jobs definition start ${{ secrets.SCALEWAY_JOB_ADVERTISING_BRAND_GROUPS_ENRICHMENT }} \
            region=${{ steps.region.outputs.value }} -o json)
          RUN_ID=$(echo "$RUN" | jq -r '.job_runs[0].id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Error: failed to start the job run"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Job run: $RUN_ID"
          for i in $(seq 1 240); do
            STATUS=$(scw jobs run get "$RUN_ID" region=${{ steps.region.outputs.value }} -o json | jq -r '.state')
            echo "Status: $STATUS"
            # finished states end the wait (a run killed in the console ends as interrupted); any other
            # state, known or not, keeps waiting, up to the time limit below
            case "$STATUS" in
              succeeded) echo "status=$STATUS" >> $GITHUB_OUTPUT; exit 0 ;;
              failed|canceled|cancelled|interrupted|error|internal_error)
                echo "status=$STATUS" >> $GITHUB_OUTPUT; echo "Error: job run ended with state $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "status=timeout" >> $GITHUB_OUTPUT
          echo "Error: the job run did not finish within 60 minutes"
          exit 1

      - name: Where to see the result
        if: always() && steps.run.outputs.run_id != ''
        run: |
          {
            echo "### Brand groups job: ${{ steps.run.outputs.status || 'unknown' }}"
            echo ""
            echo "Branch \`${GITHUB_REF_NAME}\`, image \`${{ env.TEMP_IMAGE_NAME }}:${{ steps.tag.outputs.value }}\`, ${MAX_BRANDS} brands. Written to the tab Marques unless BRAND_GROUPS_DRY_RUN is true in the env of the Scaleway job."
            echo ""
            echo "In dry run, proposed rows: in the logs of the job run \`${{ steps.run.outputs.run_id }}\`, between the lines \`----- BRAND GROUPS PROPOSALS\` and \`----- END OF BRAND GROUPS PROPOSALS\` (tab Marques), then \`----- COMPANIES PROPOSALS\` and \`----- END OF COMPANIES PROPOSALS\` (tab Entreprises), tab-separated, can be pasted in a sheet."
            echo ""
            echo "[Scaleway console, Serverless Jobs](https://console.scaleway.com/serverless-jobs/jobs) > brand groups job > Job runs > \`${{ steps.run.outputs.run_id }}\` > logs."
          } >> $GITHUB_STEP_SUMMARY

      # always, even when the run failed or timed out: the production job must not keep the branch code
      - name: Restore the production image and startup command
        if: always() && steps.update.outcome != 'skipped'
        run: |
          scw jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_BRAND_GROUPS_ENRICHMENT }} \
            region=${{ steps.region.outputs.value }} \
            image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:latest \
            startup-command.0=${{ env.ENTRYPOINT }} > /dev/null
          echo "Production job restored: quotaclimat_base:latest, ${{ env.ENTRYPOINT }}"
