# Basic CI/CD pipeline.
# Stages: install deps -> tests (split into 4 isolated jobs, see comment
# below) -> lint -> security scan -> build the Docker image -> push it to
# the registry (main branch only).
name: CI

# Déclencheurs : sur un push vers N'IMPORTE QUELLE branche (on veut voir les
# erreurs avant de merger, pas juste au moment du merge) et sur les pull
# requests. Seul le dernier job (push-image) est ensuite restreint à main.
on:
  push:
    branches: ["**"]
  pull_request:

# If you push again to the same branch while a run is still going, cancel
# the older run instead of letting both finish — saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables partagées par tous les jobs, pour ne changer une version qu'à un
# seul endroit. REGISTRY/IMAGE_NAME servent uniquement au job push-image.
env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.1.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stage 1: install dependencies (also warms the Poetry cache for later jobs)
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

  # Stage 2: run the test suite against a real Postgres database.
  #
  # Split into 4 isolated jobs instead of one "pytest test/" — mirrors what
  # this repo's previous CI did, for a concrete reason found by trial and
  # error: test_update_pg_keywords and stop_word both call drop_tables()
  # (DROP TABLE) on a shared "keywords" table using a session-scoped DB
  # connection (test/conftest.py). Run them in the same pytest process as
  # other DB tests and a leftover open transaction can make DROP TABLE wait
  # forever on a Postgres lock — that's exactly what hung this pipeline for
  # 26+ minutes earlier. Running them in their own job = a fresh process,
  # fresh connection, nothing to block on.
  test-update-pg-keywords:
    name: Run tests (update pg keywords)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: &postgres-service
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pytest-args: "-k 'test_update_pg_keywords' test/"
          report-name: update-pg-keywords

  # Same isolation reason as above — stop_word tests also call drop_tables()
  # on the shared keywords table.
  test-stop-word:
    name: Run tests (stop word)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres-service
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pytest-args: "-k 'stop_word' test/"
          report-name: stop-word

  # Pure keyword-matching logic, no database involved — kept separate so it
  # doesn't need to wait for a Postgres service at all.
  test-print-media:
    name: Run tests (print media)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pytest-args: "test/print_media/test_print_media_detect_keywords.py"
          report-name: print-media

  # Everything else. Some of these tests (test/sitemap/test_scrap_html.py)
  # fetch fixture pages over HTTP from localhost:8000 — the previous CI
  # served them with an nginx container; here a plain Python static file
  # server (pre-run) does the same job for the same mockwebsite/ fixtures.
  test-everything-else:
    name: Run tests (everything else)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres-service
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pre-run: "python3 -m http.server 8000 --directory mockwebsite &"
          pytest-args: >-
            -k 'not test_update_pg_keywords and not stop_word'
            --ignore=test/print_media/test_print_media_detect_keywords.py
            test/
          report-name: everything-else

  # Stage 3: check code style with ruff
  lint:
    name: Run linter
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run ruff
        # Non-blocking: this repo has never had a lint gate before, so it
        # carries pre-existing style debt unrelated to this pipeline. We
        # still want the report, just not a hard CI failure on legacy code.
        run: poetry run ruff check .
        continue-on-error: true

  # Stage 4: look for common security issues in the Python source code
  security-scan:
    name: Run security scan
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run bandit
        # bandit = analyse statique de sécurité pour Python (détecte les
        # patterns dangereux : eval(), secrets en dur, etc.) -f json -o pour
        # produire le "scan code report" attendu comme livrable.
        run: |
          poetry run pip install bandit
          poetry run bandit -r quotaclimat -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: bandit-report.json

  # Stage 5: build the Docker image and scan it for known vulnerabilities
  build-image:
    name: Build Docker image
    # On ne build l'image que si tests/lint/security-scan sont passés avant
    # — inutile de construire une image sur du code qui a un problème.
    needs:
      - test-update-pg-keywords
      - test-stop-word
      - test-print-media
      - test-everything-else
      - lint
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Taggée avec le SHA du commit : chaque run produit une image
        # identifiable et traçable, pas juste "latest" à chaque fois.
        run: docker build -t quotaclimat:${{ github.sha }} .

      - name: Scan image with Trivy
        # Trivy = scanner de vulnérabilités connues (CVE) dans l'image
        # buildée (dépendances système + Python). Produit le "Trivy report"
        # attendu comme livrable.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quotaclimat:${{ github.sha }}
          format: json
          output: trivy-report.json

      - name: Generate VEX file from the Trivy report
        # VEX (Vulnerability Exploitability eXchange) : dit, pour chaque CVE
        # trouvée par Trivy, si elle affecte réellement le projet ou non.
        # Voir scripts/generate_vex.py pour le détail.
        run: python3 scripts/generate_vex.py trivy-report.json vex.json

      - name: Upload Trivy + VEX report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vex-report
          path: |
            trivy-report.json
            vex.json

  # Stage 6: push the image to the registry, but only from the main branch
  push-image:
    name: Push to registry
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Droits minimum nécessaires pour ce job : lire le code, écrire un
    # package sur ghcr.io. Rien de plus (principe du moindre privilège).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # ghcr.io requires lowercase image names, GitHub repo names can be mixed case
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # Deux tags : "latest" (toujours la dernière version de main) et le
        # SHA du commit (pour pouvoir revenir précisément à une version).
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
