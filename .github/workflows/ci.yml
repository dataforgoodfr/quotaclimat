# Basic CI/CD pipeline.
# Each job below is one "stage": install deps -> test -> lint -> security scan
# -> build the Docker image -> push it to the registry (main branch only).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.1.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stage 1: install dependencies (also warms the Poetry cache for later jobs)
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

  # Stage 2: run the test suite against a real Postgres database
  test:
    name: Run tests
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run tests
        run: poetry run pytest test/ --junitxml=test-report.xml
        env:
          ENV: dev
          POSTGRES_USER: user
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.xml

  # Stage 3: check code style with ruff
  lint:
    name: Run linter
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run ruff
        # Non-blocking: this repo has never had a lint gate before, so it
        # carries pre-existing style debt unrelated to this pipeline. We
        # still want the report, just not a hard CI failure on legacy code.
        run: poetry run ruff check .
        continue-on-error: true

  # Stage 4: look for common security issues in the Python source code
  security-scan:
    name: Run security scan
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run bandit
        run: |
          poetry run pip install bandit
          poetry run bandit -r quotaclimat -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: bandit-report.json

  # Stage 5: build the Docker image and scan it for known vulnerabilities
  build-image:
    name: Build Docker image
    needs: [test, lint, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t quotaclimat:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: quotaclimat:${{ github.sha }}
          format: json
          output: trivy-report.json

      - name: Generate VEX file from the Trivy report
        run: python3 scripts/generate_vex.py trivy-report.json vex.json

      - name: Upload Trivy + VEX report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vex-report
          path: |
            trivy-report.json
            vex.json

  # Stage 6: push the image to the registry, but only from the main branch
  push-image:
    name: Push to registry
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # ghcr.io requires lowercase image names, GitHub repo names can be mixed case
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
