name: Build & Deploy to Scaleway

on:
  push:
      # Sequence of patterns matched against refs/heads
    branches:
      - main
    paths-ignore:
      - 'rrs/**'
      - 'infrastructure/**'
      - '.github/workflows/rrs.yaml'
      - 'detect_misinformation/**'
      - '.github/workflows/label-misinformation.yml'

  # to be able to force deploy
  workflow_dispatch:


env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '2.1.3'

jobs:
  # bump the version once, then build the images in parallel from the bump commit,
  # so that every image is tagged with this version and contains the pyproject.toml of this version
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
    - name: Bump version
      id: bump
      run: |
        poetry version patch
        PROJECT_VERSION=$(poetry version --short)
        git config user.name barometre-github-actions
        git config user.email barometre-github-actions@github.com
        git add pyproject.toml
        git commit -m "[no ci]: $PROJECT_VERSION bumping version"
        git push origin main
        echo "version=$PROJECT_VERSION" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: bump
    runs-on: ubuntu-latest
    env:
      PROJECT_VERSION: ${{ needs.bump.outputs.version }}
      # id of the job definition of the merged ads exportation (EXPORT_MERGED_ADS=true)
      SCALEWAY_JOB_ADVERTISING_EXPORTATION_MERGED_ADS: ${{ secrets.SCALEWAY_JOB_ADVERTISING_EXPORTATION_MERGED_ADS }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.bump.outputs.sha }}
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v4
      with:
        username: nologin
        password: ${{ secrets.SCALEWAY_API_KEY }}
        registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

    # No cleanup: removing the builder at the end of the job takes ~20 s on a runner
    # that is thrown away anyway
    - uses: docker/setup-buildx-action@v4
      with:
        cleanup: false

    # Current month, part of the cache key of the apt-get layers (see Dockerfile)
    - name: Compute apt refresh month
      id: apt
      run: echo "month=$(date -u +%Y-%m)" >> $GITHUB_OUTPUT

    # Layer cache stored in the registry under the buildcache tag, written and read by
    # every deployment (mode=max also caches the builder stage, where poetry install runs).
    # A cache error doesn't fail the deployment: the build just runs without cache.
    - name: Build and push quotaclimat_base image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: APT_REFRESH=${{ steps.apt.outputs.month }}
        push: true
        tags: |
          ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:latest
        cache-from: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:buildcache
        cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

    # Same Dockerfile, with ffmpeg installed before the code (runtime-media stage)
    - name: Build and push quotaclimat_with_media_tools image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: |
          RUNTIME=runtime-media
          APT_REFRESH=${{ steps.apt.outputs.month }}
        push: true
        tags: |
          ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:${{ env.PROJECT_VERSION }}
          ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:latest
        cache-from: |
          type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:buildcache
          type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:buildcache
        cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

    - name: Update import scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_IMPORT_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/mediatree_import.sh

    - name: update scaleway job definition with version s3
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_S3_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=python
          startup-command.1=quotaclimat/data_processing/mediatree/s3/api_to_s3.py

    - name: update scaleway job definition with version stopwords
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_STOP_WORDS_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/stop_word.sh

    - name: Update update_job scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_UPDATE_JOB_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/mediatree_import.sh
      
    - name: Update job_thematic_keywords scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }} #scaleway access key
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }} #scaleway secret key
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_THEMATIC_KEYWORDS_JOB_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=python
          startup-command.1=quotaclimat/data_processing/thematic_extracts/thematic_keywords.py

    - name: Update job_thematic_articles scaleway job #job name
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }} #scaleway access key
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }} #scaleway secrt key
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_THEMATIC_ARTICLES_JOB_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=python
          startup-command.1=quotaclimat/data_processing/thematic_extracts/thematic_articles.py
    

    - name: Update ad_s01_run_detection scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_DETECTION_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s01_run_detection.sh

    - name: Update ad_s02_run_exportation scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_EXPORTATION }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s02_run_exportation.sh

    # Same image and entrypoint as ad_s02_run_exportation: the job definition sets EXPORT_MERGED_ADS=true
    # (and its own resources), which this update leaves as they are. Skipped until the secret exists.
    - name: Update ad_s02_run_exportation_merged_ads scaleway job
      if: ${{ env.SCALEWAY_JOB_ADVERTISING_EXPORTATION_MERGED_ADS != '' }}
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ env.SCALEWAY_JOB_ADVERTISING_EXPORTATION_MERGED_ADS }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s02_run_exportation.sh

    - name: Update ad_s05e01_brand_groups_enrichment scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_BRAND_GROUPS_ENRICHMENT }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s05e01_brand_groups_enrichment.sh

    - name: Update ad_s04e01_merge_split_ads scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_MERGE_SPLIT_ADS }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s04e01_merge_split_ads.sh

    - name: Update ad_s05e02_screenshots_enrichment scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_SCREENSHOTS }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s05e02_screenshots_enrichment.sh

    # media tools image: ffmpeg cuts the video of the new ads
    - name: Update ad_s04e02_manual_corrections scaleway job
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_ADVERTISING_MANUAL_CORRECTIONS }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_with_media_tools:${{ env.PROJECT_VERSION }}
          startup-command.0=./entrypoints/ad_s04e02_manual_corrections.sh

    # uses the quotaclimat_base image, so updated here once that image is pushed
    - name: Update Scaleway job definition with Factiva Stats image
      uses: jawher/action-scw@v2.54.0
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
        SCW_ZONE: ${{ secrets.SCW_ZONE }}
      with:
        args: >-
          jobs definition update ${{ secrets.SCALEWAY_JOB_FACTIVA_STATS_ID }}
          image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/quotaclimat_base:${{ env.PROJECT_VERSION }}
          startup-command.0=python
          startup-command.1=-m
          startup-command.2=quotaclimat.data_ingestion.factiva.factiva_to_s3.factiva_stats_to_s3

  build-factiva:
    needs: bump
    runs-on: ubuntu-latest
    env:
      PROJECT_VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      # No cleanup: removing the builder at the end of the job takes ~20 s on a runner
      # that is thrown away anyway
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      # Same registry layer cache as quotaclimat_base, one buildcache tag per image
      - name: Build and push factiva_to_s3 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile_factiva_to_s3
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/factiva_to_s3:${{ env.PROJECT_VERSION }}
            ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/factiva_to_s3:latest
          cache-from: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/factiva_to_s3:buildcache
          cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/factiva_to_s3:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Build and push s3_factiva_to_postgre image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile_s3_factiva_to_postgre
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/s3_factiva_to_postgre:${{ env.PROJECT_VERSION }}
            ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/s3_factiva_to_postgre:latest
          cache-from: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/s3_factiva_to_postgre:buildcache
          cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/s3_factiva_to_postgre:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Build and push lemonde_web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile_lemonde_web
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/lemonde_web:${{ env.PROJECT_VERSION }}
            ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/lemonde_web:latest
          cache-from: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/lemonde_web:buildcache
          cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/lemonde_web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Update Scaleway job definition with Factiva to S3 image
        uses: jawher/action-scw@v2.54.0
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_ZONE: ${{ secrets.SCW_ZONE }}
        with:
          args: jobs definition update ${{ secrets.SCALEWAY_JOB_FACTIVA_TO_S3_ID }} image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/factiva_to_s3:${{ env.PROJECT_VERSION }}

      - name: Update Scaleway job definition with S3 Factiva to Postgre image
        uses: jawher/action-scw@v2.54.0
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_ZONE: ${{ secrets.SCW_ZONE }}
        with:
          args: jobs definition update ${{ secrets.SCALEWAY_JOB_S3_FACTIVA_TO_POSTGRE_ID }} image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/s3_factiva_to_postgre:${{ env.PROJECT_VERSION }}

      - name: Update Scaleway job definition with Le Monde Web image
        uses: jawher/action-scw@v2.54.0
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_ZONE: ${{ secrets.SCW_ZONE }}
        with:
          args: jobs definition update ${{ secrets.SCALEWAY_JOB_LEMONDE_WEB_ID }} image-uri=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/lemonde_web:${{ env.PROJECT_VERSION }}
