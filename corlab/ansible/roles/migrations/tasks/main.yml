---
# Applies alembic/ (repo root) to the barometre database. `alembic upgrade head` is
# idempotent, so the role can be re-run after each new migration (`make migrate`).
# It is tagged `never` in the playbook: it only runs when asked for explicitly.

# The code is shipped as a tar archive through Ansible's own connection (password SSH + sudo):
# rsync would run as the login user and could not write to the root-owned /opt/services.
# Only what alembic/env.py and the migrations import.
- name: Create a local temporary file for the archive
  ansible.builtin.tempfile:
    state: file
    suffix: .tgz
  delegate_to: localhost
  become: false
  register: migrations_archive
  changed_when: false
  check_mode: false

- name: Archive the alembic project and the code it imports (local)
  ansible.builtin.command:
    argv:
      - tar
      - -czf
      - "{{ migrations_archive.path }}"
      - --exclude=__pycache__
      - --exclude=*.pyc
      - -C
      - "{{ repo_root }}"
      - pyproject.toml
      - poetry.lock
      - alembic.ini
      - alembic
      - postgres
      - quotaclimat
  environment:
    COPYFILE_DISABLE: "1"   # macOS: no ._* metadata files in the archive
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Remove the previous build directory
  file:
    path: "{{ migrations_dir }}/src"
    state: absent

- name: Create migrations build directory
  file:
    path: "{{ migrations_dir }}/src"
    state: directory
    mode: "0755"

- name: Unpack the archive on the server
  ansible.builtin.unarchive:
    src: "{{ migrations_archive.path }}"
    dest: "{{ migrations_dir }}/src"

- name: Remove the local temporary archive
  ansible.builtin.file:
    path: "{{ migrations_archive.path }}"
    state: absent
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Copy the migrations Dockerfile
  copy:
    src: "{{ playbook_dir }}/../migrations/Dockerfile"
    dest: "{{ migrations_dir }}/src/Dockerfile"
    mode: "0644"

- name: Build the migrations image
  community.docker.docker_image:
    name: "{{ migrations_image }}"
    source: build
    force_source: true
    build:
      path: "{{ migrations_dir }}/src"
      dockerfile: Dockerfile

- name: Run alembic upgrade head on the barometre database
  community.docker.docker_container:
    name: corlab-alembic
    image: "{{ migrations_image }}"
    command: alembic upgrade head
    networks:
      - name: corlab-internal
    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB: "{{ barometre_db_name }}"
    detach: false
    cleanup: true
    auto_remove: false
  register: alembic_run
  no_log: true

- name: Show the alembic output
  ansible.builtin.debug:
    msg: "{{ alembic_run.container.Output | default('') }}"
