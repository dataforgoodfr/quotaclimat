# Export des données du rapport vers Google Sheets (flow export_report_data, format : ../export_data.md).
# Le Sheet est cherché par son nom dans le dossier Drive « Rapports » du dossier partagé.
# Chaque onglet porte ses données en colonnes A à H et son graphique à côté : seules les colonnes A à H sont
# remplacées à chaque export.
outputs:
  - type: sheet
    spreadsheet: 2027-02-pub-desinformation
    tabs:
      # partie 3 : part exposée par annonceur, chaînes d'info
      - tab: part_temps_de_pub_prox_mesinfo_par_annonceurs
        query: bulles_annonceurs_secteur_sheets.sql
        columns: A:H
      # partie 4.1 : part exposée par catégorie de produit, trois premiers secteurs
      - tab: part_temps_de_pub_prox_mesinfo_par_categ
        query: bulles_categories_secteur_sheets.sql
        columns: A:H
