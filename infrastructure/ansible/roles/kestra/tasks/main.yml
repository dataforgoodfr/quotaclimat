---
- name: Create kestra directory
  file:
    path: /opt/services/kestra
    state: directory
    mode: "0755"

- name: Remove stale config files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/services/kestra/.env
    - /opt/services/kestra/application.yml

- name: Get docker.sock group id on host
  stat:
    path: /var/run/docker.sock
  register: docker_sock_stat

- name: Set kestra docker group id fact
  set_fact:
    kestra_docker_gid: "{{ docker_sock_stat.stat.gid }}"

- name: Template kestra docker-compose
  template:
    src: "{{ playbook_dir }}/../compose/kestra/docker-compose.yml.j2"
    dest: /opt/services/kestra/docker-compose.yml
    mode: "0644"

- name: Copy kestra flow definitions
  copy:
    src: "{{ playbook_dir }}/../kestra/flows/"
    dest: /opt/services/kestra/flows/

# The flows directory is bind-mounted into the container: deleting and
# recreating it would leave the container on the old, empty directory.
# Only remove the files of flows deleted from the repository instead.
- name: List deployed kestra flow files
  find:
    paths: /opt/services/kestra/flows
    file_type: file
  register: kestra_deployed_flows

- name: Remove flows deleted from the repository
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ kestra_deployed_flows.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in kestra_repo_flows
  vars:
    kestra_repo_flows: "{{ lookup('fileglob', playbook_dir ~ '/../kestra/flows/*', wantlist=True) | map('basename') | list }}"

- name: Set ownership of flows directory to kestra container user (uid/gid 1000)
  file:
    path: /opt/services/kestra/flows
    state: directory
    recurse: true
    owner: "1000"
    group: "1000"
    mode: "u=rwX,g=rwX,o=rX"

- name: Start kestra
  community.docker.docker_compose_v2:
    project_src: /opt/services/kestra
    state: present
    pull: always
  register: kestra_compose

# Always restart: kestra_compose.changed is true as soon as any service of the
# stack changes (e.g. a new autoheal image), even when kestra was not recreated.
- name: Restart kestra to pick up flow changes
  community.docker.docker_container:
    name: kestra
    state: started
    restart: true

- name: Wait for Kestra to be healthy
  shell: docker exec kestra curl -sf http://localhost:8080/api/v1/configs
  register: kestra_health
  retries: 30
  delay: 5
  until: kestra_health.rc == 0
  changed_when: false
