---
- name: Manage SSH authorized keys
  authorized_key:
    user: "{{ item.0 }}"
    key: "{{ item.1.key }}"
    comment: "{{ item.1.name }}"
    state: "{{ item.1.state | default('present') }}"
  loop: "{{ ['root', 'ubuntu'] | product(ssh_authorized_keys) | list }}"
  loop_control:
    label: "{{ item.0 }} <- {{ item.1.name }}"
