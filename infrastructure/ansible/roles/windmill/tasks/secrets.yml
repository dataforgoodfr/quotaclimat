---
# Copies the Kestra secrets (kestra_secrets and kestra_secrets_dev in playbook.yml, read from
# .env.secrets) to Windmill secret variables f/secrets/<NAME>, through the Windmill API.
# A variable is written only when it is missing or its value changed, so a second run
# reports no change. Values never reach the logs (no_log).

- name: Check the Windmill API settings
  assert:
    that:
      - windmill_token | length > 0
      - windmill_workspace | length > 0
    fail_msg: WINDMILL_TOKEN and WINDMILL_WORKSPACE must be set in .env.secrets (see infrastructure/Readme.md, Windmill)
    quiet: true

# Values are rendered as strings: Ansible turns JSON-looking values (I18N_COUNTRY_SECRETS,
# GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON) and numbers into structures, to_json turns them back.
- name: Build the list of Windmill secrets
  set_fact:
    windmill_secrets: >-
      {%- set out = [] -%}
      {%- for name, value in (kestra_secrets | combine(kestra_secrets_dev)) | dictsort -%}
      {%- set _ = out.append({'name': name, 'value': value if value is string else (value | to_json)}) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: List the secrets left empty in .env.secrets (not written to Windmill)
  debug:
    msg: "Empty, skipped: {{ windmill_secrets | selectattr('value', 'equalto', '') | map(attribute='name') | join(', ') }}"
  when: windmill_secrets | selectattr('value', 'equalto', '') | list | length > 0

- name: Check whether the secrets folder exists
  uri:
    url: "{{ windmill_api_url }}/folders/exists/{{ windmill_secrets_folder }}"
    headers:
      Authorization: "Bearer {{ windmill_token }}"
    return_content: true
  register: windmill_secrets_folder_exists
  no_log: true

- name: Create the secrets folder
  uri:
    url: "{{ windmill_api_url }}/folders/create"
    method: POST
    headers:
      Authorization: "Bearer {{ windmill_token }}"
    body_format: json
    body:
      name: "{{ windmill_secrets_folder }}"
      summary: Secrets of the flows, synced from .env.secrets by Ansible (do not edit by hand)
      owners: []
      extra_perms: {}
    status_code: [200, 201]
  when: not (windmill_secrets_folder_exists.json | bool)
  changed_when: true
  no_log: true

- name: Check which secrets exist
  uri:
    url: "{{ windmill_api_url }}/variables/exists/f/{{ windmill_secrets_folder }}/{{ item.name }}"
    headers:
      Authorization: "Bearer {{ windmill_token }}"
    return_content: true
  loop: "{{ windmill_secrets | rejectattr('value', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: windmill_secrets_exist
  no_log: true

- name: Read the current value of the existing secrets
  uri:
    url: "{{ windmill_api_url }}/variables/get/f/{{ windmill_secrets_folder }}/{{ item.item.name }}?decrypt_secret=true"
    headers:
      Authorization: "Bearer {{ windmill_token }}"
    return_content: true
  loop: "{{ windmill_secrets_exist.results | selectattr('json') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: windmill_secrets_current
  no_log: true

- name: Create the missing secrets
  uri:
    url: "{{ windmill_api_url }}/variables/create"
    method: POST
    headers:
      Authorization: "Bearer {{ windmill_token }}"
    body_format: json
    # Built as a JSON string so the value stays a string (see "Build the list");
    # uri sends a string body as is
    body: >-
      {{ {'path': 'f/' ~ windmill_secrets_folder ~ '/' ~ item.item.name,
          'value': item.item.value,
          'is_secret': true,
          'description': windmill_secret_description} | to_json }}
    status_code: [200, 201]
  loop: "{{ windmill_secrets_exist.results | rejectattr('json') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true
  no_log: true

- name: Update the secrets whose value changed
  uri:
    url: "{{ windmill_api_url }}/variables/update/f/{{ windmill_secrets_folder }}/{{ item.item.item.name }}"
    method: POST
    headers:
      Authorization: "Bearer {{ windmill_token }}"
    body_format: json
    body: >-
      {{ {'value': item.item.item.value,
          'is_secret': true,
          'description': windmill_secret_description} | to_json }}
    status_code: [200, 201]
  loop: "{{ windmill_secrets_current.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  when: item.json.value != item.item.item.value
  changed_when: true
  no_log: true
