id: pipeline
namespace: corlab

description: |
  Prod pipeline of the Corlab radios, in their own database (deployed by corlab/).
  Mediatree to S3, keywords, misinformation, dbt. No schedule: run by hand.

labels:
  pipeline: corlab
  environment: prod
  scope: france

inputs:
  - id: days_back
    type: INT
    defaults: 1
    description: Number of days prior to the start date to process. Defaults to 1.
  - id: start_date
    type: DATE
    required: false
    description: "Reference date (YYYY-MM-DD) from which to count days back. Defaults to now."
  - id: label_studio_project
    type: INT
    required: true
    description: Id of the Corlab Label Studio project (in its URL), where detect_misinformation sends the extracts. No default on purpose, so that no other country's project is used by mistake.
  - id: label_studio_project_id
    type: INT
    required: true
    description: Id of the Cloud Storage of that project in Label Studio (the S3 storage id, see detect_misinformation/jobs/README.md).

tasks:
  - id: ingest_data_to_s3
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && python /app/quotaclimat/data_processing/mediatree/s3/api_to_s3.py
    shmSize: 10gb
    env:
      API_TO_S3_CONCURRENCY: 10
      BUCKET_NAME: mediatree-corlab-prod
      COUNTRY: clb
      CORLAB_PERIMETER: true
      ENV: prod
      KEYWORDS_URL: https://keywords.mediatree.fr/api/subtitle/
      LOGLEVEL: INFO
      MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
      MEDIATREE_USER: quotaclimat
      MODIN_CPUS: 2
      MODIN_ENGINE: python
      MODIN_MEMORY: 2000000000
      NUMBER_OF_PREVIOUS_DAYS: "{{ inputs.days_back }}"
      OMP_NUM_THREADS: 3
      PORT_HS: 5666
      START_DATE: "{{ (inputs.start_date ?? now()) | timestamp() }}"
      BUCKET: "{{ secret('CORLAB_SCW_ACCESS') }}"
      BUCKET_SECRET: "{{ secret('CORLAB_SCW_SECRET') }}"
      MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"

  - id: detect_keywords
    logLevel: WARN          # filter per-row INFO spam at the Kestra level (UI freeze fix)
    shmSize: 2gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && /app/entrypoints/detect_keywords.sh
    env:
      BATCH_SIZE: 5000
      BUCKET_NAME: mediatree-corlab-prod
      COMPARE_DURATION: true
      COUNTRY: clb
      CORLAB_PERIMETER: true
      DBT_PROFILES_DIR: /app/my_dbt_project/dbt
      DBT_PROJECT_DIR: /app/my_dbt_project
      ENV: prod
      FILTER_DAYS_STOP_WORD: 3000
      HEALTHCHECK_SERVER: 0.0.0.0
      KEYWORDS_URL: https://keywords.mediatree.fr/api/v2/subtitle/
      LOGLEVEL: INFO
      MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
      MEDIATREE_USER: quotaclimat
      MODIN_CPUS: 2
      MODIN_ENGINE: ray
      MODIN_MEMORY: 2000000000
      NUMBER_OF_PREVIOUS_DAYS: "{{ inputs.days_back }}"
      POSTGRES_DB: barometre
      POSTGRES_PORT: 5432
      RAY_COLOR_PREFIX: 1
      RAY_memory_monitor_refresh_ms: 0
      START_DATE: "{{ (inputs.start_date ?? now()) | timestamp() }}"
      BUCKET: "{{ secret('CORLAB_SCW_ACCESS') }}"
      BUCKET_SECRET: "{{ secret('CORLAB_SCW_SECRET') }}"
      MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
      POSTGRES_USER: "{{ secret('CORLAB_PG_USER') }}" # needs to be the owner of the database to run the migrations
      POSTGRES_HOST: "{{ secret('CORLAB_PG_HOST') }}"
      POSTGRES_PASSWORD: "{{ secret('CORLAB_PG_PASSWORD') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"

  - id: detect_misinformation
    logLevel: WARN          # filter per-row INFO spam at the Kestra level (UI freeze fix)
    shmSize: 2gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/misinformation/label-misinformation:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/misinformation
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && python /app/main.py
    env:
      APP_NAME: label-misinformation-corlab
      AWS_DEFAULT_REGION: fr-par
      BUCKET_INPUT: misinformation-corlab-prod
      BUCKET_OUTPUT: misinformation-corlab-prod
      BUCKET_OUTPUT_FOLDER: label-misinformation-input
      COUNTRY: clb
      ENV: production
      KEYWORDS_URL: https://keywords.mediatree.fr/api/v2/subtitle/
      LABEL_STUDIO_PROJECT: "{{ inputs.label_studio_project }}"
      LABEL_STUDIO_PROJECT_ID: "{{ inputs.label_studio_project_id }}"
      LABEL_MISINFORMATION_OVERWRITE: 1
      LABEL_STUDIO_URL: https://barometre7kfudatm-labelstudio.functions.fnc.fr-par.scw.cloud
      LOGLEVEL: INFO
      MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
      MEDIATREE_USER: quotaclimat
      LLM_CONCURRENCY: "10"
      LLM_PROVIDER: mistral
      MODEL_NAME: mistral-small-2603
      MIN_MISINFORMATION_SCORE: 8
      MODIN_MEMORY: 2000000000
      NUMBER_OF_PREVIOUS_DAYS: "{{ inputs.days_back }}"
      POSTGRES_DB_LS: labelstudio
      POSTGRES_HOST_LS: "{{ secret('POSTGRES_HOST') }}"
      POSTGRES_USER_LS: "{{ secret('POSTGRES_USER_READ') }}"
      POSTGRES_PASSWORD_LS: "{{ secret('POSTGRES_PASSWORD_READ') }}"
      POSTGRES_PORT_LS: 22737
      POSTGRES_DB: barometre
      POSTGRES_PORT: 5432
      RAY_COLOR_PREFIX: 1
      DATE: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"
      API_LABEL_STUDIO_KEY: "{{ secret('API_LABEL_STUDIO_KEY') }}"
      BUCKET_ACCESS: "{{ secret('CORLAB_SCW_ACCESS') }}"
      BUCKET_SECRET: "{{ secret('CORLAB_SCW_SECRET') }}"
      MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
      MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
      POSTGRES_USER: "{{ secret('CORLAB_PG_USER') }}"
      POSTGRES_HOST: "{{ secret('CORLAB_PG_HOST') }}"
      POSTGRES_PASSWORD: "{{ secret('CORLAB_PG_PASSWORD') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
      FORCE_WHISPER_TRANSCRIPTION: ""

  - id: dbt_run_transformations
    shmSize: 6gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && /app/entrypoints/dbt.sh
    env:
      CORLAB_PERIMETER: true
      DBT_ENV: prod
      DBT_PROFILES_DIR: /app/my_dbt_project/dbt
      DBT_PROJECT_DIR: /app/my_dbt_project
      LOGLEVEL: INFO
      MODIN_CPUS: 2
      MODIN_ENGINE: python
      MODIN_MEMORY: 3000000000
      POSTGRES_DB: barometre
      POSTGRES_PORT: 5432
      POSTGRES_USER: "{{ secret('CORLAB_PG_USER') }}"
      POSTGRES_HOST: "{{ secret('CORLAB_PG_HOST') }}"
      POSTGRES_PASSWORD: "{{ secret('CORLAB_PG_PASSWORD') }}"

# runs when a task above fails
errors:
  # one message per webhook of MATTERMOST_WEBHOOK_URLS (comma-separated), all sent in parallel
  # so that a dead webhook does not prevent the others from being notified
  - id: alert_mattermost
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ secret('MATTERMOST_WEBHOOK_URLS') | split(',') | toJson }}"
    concurrencyLimit: 0
    tasks:
      # plain HTTP call rather than the notifications plugin (not bundled in the Kestra image)
      - id: send
        type: io.kestra.plugin.core.http.Request
        uri: "{{ taskrun.value | trim }}"
        method: POST
        contentType: application/json
        body: |
          {%- set failed_steps = outputs | jq('to_entries[] | select((.value | type) == "object" and (.value.state? == "FAILED")) | .key') -%}
          {%- set step = failed_steps | first -%}
          {{ {
            'username': 'Kestra',
            'text': 'corlab/pipeline failed at step `' ~ (step ?? 'unknown') ~ '`.\nExecution: ' ~ kestra.url ~ 'ui/main/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id
          } | toJson }}
