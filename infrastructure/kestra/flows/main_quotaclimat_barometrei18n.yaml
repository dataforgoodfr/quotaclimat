id: barometre-i18n
namespace: quotaclimat

description: |
  OME pipeline for international scope. For each country: ingest Mediatree data to S3,
  detect keywords, then detect misinformation (label-misinformation image, run on the
  Kestra VM). The dbt subflow runs once at the end, after all countries.

  Per-country credentials and endpoint (country bucket keys, Label Studio token and URL) are
  read from the single JSON secret I18N_COUNTRY_SECRETS, keyed by country code. Other
  per-country config is in `variables.countries`. To add a country: add its code to the ForEach values,
  an entry in `variables.countries` and a key in the secret.

labels:
  pipeline: ome
  environment: prod
  scope: i18n

variables:
  # Keyed by the Mediatree country code used in the loop.
  # name: full country name, expected by the label-misinformation job as COUNTRY.
  countries:
    bel:
      name: belgium
      bucket: safeguards-climate-belgium-prod
      label_studio_project: 2
      label_studio_project_id: 1
    bel-fla:
      name: belgium-flanders
      bucket: safeguards-climate-belgium-flanders-prod
      label_studio_project: 1
      label_studio_project_id: 1
    deu:
      name: germany
      bucket: safeguards-climate-germany-prod
      label_studio_project: 1
      label_studio_project_id: 1
    esp:
      name: spain
      bucket: safeguards-climate-spain-prod
      label_studio_project: 1
      label_studio_project_id: 1
    pol:
      name: poland
      bucket: safeguards-climate-poland-prod
      label_studio_project: 1
      label_studio_project_id: 1

triggers:
  - id: morning_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "7 04 * * *"
    timezone: Europe/Paris

inputs:
  - id: days_back
    type: INT
    defaults: 1
    description: Days prior to the start date to process. Defaults to 1.
  - id: start_date
    type: DATE
    required: false
    description: "Reference date (YYYY-MM-DD) from which to count days back. Defaults to now."
  - id: countries
    type: MULTISELECT
    values: ["bel", "bel-fla", "deu", "esp", "pol"]
    defaults: ["bel", "bel-fla", "deu", "esp", "pol"]
    description: "Countries to process. Defaults to all; untick all but one to run a single country."
  - id: api_data_overwrite
    type: BOOL
    defaults: false
    description: "Set API_DATA_OVERWRITE=1: fetch from Mediatree again and overwrite channel/days already on S3."
  - id: label_misinformation_overwrite
    type: BOOL
    defaults: false
    description: "Set LABEL_MISINFORMATION_OVERWRITE=1: reprocess extracts not yet included in Label Studio."

tasks:
  - id: i18n_loop
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.countries }}"
    concurrencyLimit: 1
    tasks:
      - id: ingest_data_to_s3
        type: io.kestra.plugin.docker.Run
        allowFailure: true
        containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
        pullPolicy: ALWAYS
        credentials:
          registry: rg.fr-par.scw.cloud/namespace-barometre
          username: nologin
          password: "{{ secret('SCW_SECRET') }}"
        entryPoint:
          - /bin/sh
          - -c
          - cd /app && python /app/quotaclimat/data_processing/mediatree/s3/api_to_s3.py
        shmSize: 6gb
        env:
          API_TO_S3_CONCURRENCY: 10
          # The job tests bool(env), so the variable must be empty (not "0") when off.
          API_DATA_OVERWRITE: "{{ inputs.api_data_overwrite ? '1' : '' }}"
          BUCKET_NAME: mediatree
          COUNTRY: "{{ taskrun.value }}"
          ENV: prod
          KEYWORDS_URL: https://keywords.mediatree.fr/api/subtitle/
          LOGLEVEL: INFO
          MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
          MEDIATREE_USER: quotaclimat
          MODIN_CPUS: 2
          MODIN_ENGINE: python
          MODIN_MEMORY: 3000000000
          NUMBER_OF_PREVIOUS_DAYS: "{{ inputs.days_back }}"
          OMP_NUM_THREADS: 3
          PORT_HS: 5666
          START_DATE: "{{ (inputs.start_date ?? now()) | timestamp() }}"
          BUCKET: "{{ secret('SCW_ACCESS') }}"
          BUCKET_SECRET: "{{ secret('SCW_SECRET') }}"
          MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
          SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
          SENTRY_LOGGING: "true"
          SERVICE_NAME: api-to-s3

      - id: detect_keywords
        allowFailure: true
        logLevel: WARN          # filter per-row INFO spam at the Kestra level (UI freeze fix)
        shmSize: 6gb
        type: io.kestra.plugin.docker.Run
        containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
        pullPolicy: ALWAYS
        credentials:
          registry: rg.fr-par.scw.cloud/namespace-barometre
          username: nologin
          password: "{{ secret('SCW_SECRET') }}"
        entryPoint:
          - /bin/sh
          - -c
          - cd /app && /app/entrypoints/detect_keywords.sh
        env:
          BATCH_SIZE: 5000
          BUCKET_NAME: mediatree
          COMPARE_DURATION: true
          COUNTRY: "{{ taskrun.value }}"
          DBT_PROFILES_DIR: /app/my_dbt_project/dbt
          DBT_PROJECT_DIR: /app/my_dbt_project
          ENV: prod
          FILTER_DAYS_STOP_WORD: 3000
          HEALTHCHECK_SERVER: 0.0.0.0
          KEYWORDS_URL: https://keywords.mediatree.fr/api/v2/subtitle/
          LOGLEVEL: INFO
          MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
          MEDIATREE_USER: quotaclimat
          MODIN_CPUS: 2
          MODIN_ENGINE: ray
          MODIN_MEMORY: 3000000000
          NUMBER_OF_PREVIOUS_DAYS: "{{ inputs.days_back }}"
          POSTGRES_DB: barometre
          POSTGRES_PORT: 22737
          RAY_COLOR_PREFIX: 1
          RAY_memory_monitor_refresh_ms: 0
          START_DATE: "{{ (inputs.start_date ?? now()) | timestamp() }}"
          BUCKET: "{{ secret('SCW_ACCESS') }}"
          BUCKET_SECRET: "{{ secret('SCW_SECRET') }}"
          MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
          POSTGRES_USER: "{{ secret('POSTGRES_USER') }}"
          POSTGRES_HOST: "{{ secret('POSTGRES_HOST') }}"
          POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"
          SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
          SENTRY_LOGGING: "true"
          SERVICE_NAME: detect-keywords

      - id: detect_misinformation
        allowFailure: true
        logLevel: WARN          # filter per-row INFO spam at the Kestra level (UI freeze fix)
        shmSize: 6gb
        type: io.kestra.plugin.docker.Run
        containerImage: "rg.fr-par.scw.cloud/misinformation/label-misinformation:latest"
        pullPolicy: ALWAYS
        credentials:
          registry: rg.fr-par.scw.cloud/misinformation
          username: nologin
          password: "{{ secret('SCW_SECRET') }}"
        entryPoint:
          - /bin/sh
          - -c
          - cd /app && python /app/main.py
        env:
          APP_NAME: "label-misinformation-{{ vars.countries[taskrun.value].name }}-prod"
          AWS_DEFAULT_REGION: fr-par
          BUCKET_INPUT: mediatree
          BUCKET_OUTPUT: "{{ vars.countries[taskrun.value].bucket }}"
          BUCKET_OUTPUT_FOLDER: label-misinformation-input
          COUNTRY: "{{ vars.countries[taskrun.value].name }}"
          ENV: production
          KEYWORDS_URL: https://keywords.mediatree.fr/api/export/single
          LABEL_MISINFORMATION_OVERWRITE: "{{ inputs.label_misinformation_overwrite ? '1' : '' }}"
          LABEL_STUDIO_PROJECT: "{{ vars.countries[taskrun.value].label_studio_project }}"
          LABEL_STUDIO_PROJECT_ID: "{{ vars.countries[taskrun.value].label_studio_project_id }}"
          LLM_PROVIDER: mistral
          LOGLEVEL: INFO
          MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
          MEDIATREE_USER: quotaclimat
          MODEL_NAME: mistral-small-2603
          MODIN_MEMORY: 3000000000
          NUMBER_OF_PREVIOUS_DAYS: "{{ inputs.days_back + 1 }}"
          POSTGRES_DB: barometre
          POSTGRES_PORT: 22737
          RAY_COLOR_PREFIX: 1
          DATE: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"
          # Per-country credentials, from the single JSON secret I18N_COUNTRY_SECRETS
          # ({"<code>": {"bucket_access", "bucket_secret", "label_studio_token", "label_studio_url"}}).
          LABEL_STUDIO_URL: >-
            {{ secret('I18N_COUNTRY_SECRETS') | jq('.["' ~ taskrun.value ~ '"].label_studio_url') | first }}
          API_LABEL_STUDIO_KEY: >-
            {{ secret('I18N_COUNTRY_SECRETS') | jq('.["' ~ taskrun.value ~ '"].label_studio_token') | first }}
          BUCKET_ACCESS: >-
            {{ secret('I18N_COUNTRY_SECRETS') | jq('.["' ~ taskrun.value ~ '"].bucket_access') | first }}
          BUCKET_SECRET: >-
            {{ secret('I18N_COUNTRY_SECRETS') | jq('.["' ~ taskrun.value ~ '"].bucket_secret') | first }}
          MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
          MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
          OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
          POSTGRES_HOST: "{{ secret('POSTGRES_HOST') }}"
          POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD_READ') }}"
          POSTGRES_USER: "{{ secret('POSTGRES_USER_READ') }}"
          SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
          SENTRY_LOGGING: "true"
          SERVICE_NAME: detect-misinformation

  - id: dbt_run_transformations
    type: io.kestra.plugin.core.flow.Subflow
    namespace: quotaclimat
    flowId: dbt
    wait: true
    transmitFailed: true
