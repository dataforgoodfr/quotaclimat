id: dbt
namespace: quotaclimat

description: |
  Runs the dbt models of the barometre database (entrypoints/dbt.sh). Called as a
  subflow by barometre, barometre-catchup and dbt-analytics, so that two dbt runs
  never overlap: they drop and rebuild the same tables (concurrency limit 1, a
  second run waits in the queue until the first one ends).
  With only_analytics, the models of models/dashboards and models/homepage (the
  long part, computed from the whole keywords table) are left out and keep their
  last build.

labels:
  pipeline: ome
  environment: prod
  scope: france

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: only_analytics
    type: BOOLEAN
    defaults: false
    description: "When true, leaves out the models of models/dashboards and models/homepage (dbt.sh analytics)."

tasks:
  - id: dbt_run_transformations
    shmSize: 6gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - >-
        cd /app && /app/entrypoints/dbt.sh {{ inputs.only_analytics ? 'analytics' : '' }}
    env:
      EXTERNAL_SOURCES_DRIVE_FOLDER: "{{ secret('EXTERNAL_SOURCES_DRIVE_FOLDER') }}"
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: "{{ secret('GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON') }}"
      DBT_ENV: prod
      DBT_PROFILES_DIR: /app/my_dbt_project/dbt
      DBT_PROJECT_DIR: /app/my_dbt_project
      LOGLEVEL: INFO
      MODIN_CPUS: 2
      MODIN_ENGINE: python
      MODIN_MEMORY: 3000000000
      POSTGRES_DB: barometre
      POSTGRES_PORT: 22737
      BUCKET: "{{ secret('SCW_ACCESS') }}"
      BUCKET_SECRET: "{{ secret('SCW_SECRET') }}"
      LABELSTUDIO_INGESTION_POSTGRES_USER: "{{ secret('POSTGRES_USER_READ') }}"
      LABELSTUDIO_INGESTION_POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD_READ') }}"
      LABELSTUDIO_POSTGRES_HOST: "{{ secret('POSTGRES_HOST') }}"
      LABELSTUDIO_POSTGRES_PORT: 22737
      POSTGRES_USER: "{{ secret('POSTGRES_USER') }}"
      POSTGRES_HOST: "{{ secret('POSTGRES_HOST') }}"
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"

  # Clean tables for the teams and their Claude (schema curated, see my_dbt_project/models/curated/): built from
  # the tables above, tested, then their dbt documentation is pushed to Metabase. A failure leaves the
  # execution in WARNING without stopping the main pipeline. In this flow, so that dbt-analytics rebuilds them too
  # and they are never rebuilt during another dbt run.
  - id: curated_and_metabase_docs
    allowFailure: true
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && /app/entrypoints/curated.sh
    env:
      DBT_ENV: prod
      DBT_PROFILES_DIR: /app/my_dbt_project/dbt
      DBT_PROJECT_DIR: /app/my_dbt_project
      LOGLEVEL: INFO
      POSTGRES_DB: barometre
      POSTGRES_PORT: 22737
      POSTGRES_USER: "{{ secret('POSTGRES_USER') }}"
      POSTGRES_HOST: "{{ secret('POSTGRES_HOST') }}"
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"
      # Metabase databases reading the barometre database (Scaleway Postgres), ids separated by spaces
      METABASE_CURATED_DATABASES: "2 13"
      METABASE_URL: "{{ secret('METABASE_URL') }}"
      METABASE_API_KEY: "{{ secret('METABASE_API_KEY') }}"
