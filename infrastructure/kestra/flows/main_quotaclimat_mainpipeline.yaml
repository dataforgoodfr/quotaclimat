id: main-pipeline
namespace: quotaclimat

description: |
  Main pipeline, twice daily (01:10 and 12:30). Runs the extended perimeter
  pipeline, processes it in RRS (without clustering), runs the standard OME
  `barometre` pipeline, then the RRS flows on the barometre source, and last
  updates the Metabase questions versioned in metabase/ (`metabase-sync`,
  once all the tables they read are built).
  Each step is a subflow that must succeed before the next one starts.
  `metabase-sync` failing (Metabase down, a table unknown to Metabase) only
  marks the run as WARNING. It runs with force: SQL edited in Metabase is
  overwritten by the versioned one (differences in its logs).

labels:
  pipeline: ome
  environment: prod
  scope: france

inputs:
  - id: with_rrs
    type: BOOLEAN
    defaults: true
    description: "When false, skips the extended perimeter and all RRS jobs and only runs barometre."
  - id: days_back
    type: INT
    defaults: 1
    description: Days prior to the start date to process. Defaults to 1.
  - id: start_date
    type: DATE
    required: false
    description: "Reference date (YYYY-MM-DD) from which to count days back. Defaults to now."

variables:
  # namespace/flowId of each subflow task, to link the failed one in the alert
  subflows:
    extended_perimeter: rrs/extended-perimeter
    rrs_climate_extended: rrs/rrs-climate
    rrs_insecurity_extended: rrs/rrs-insecurity
    rrs_pollution_extended: rrs/rrs-pollution
    barometre: quotaclimat/barometre
    rrs_climate: rrs/rrs-climate
    rrs_insecurity: rrs/rrs-insecurity
    rrs_pollution: rrs/rrs-pollution

triggers:
  - id: morning_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "10 01 * * *"
    timezone: Europe/Paris

  - id: afternoon_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 12 * * *"
    timezone: Europe/Paris

tasks:
  - id: extended_perimeter
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: extended-perimeter
    wait: true
    transmitFailed: true
    inputs:
      days_back: "{{ inputs.days_back }}"
      start_date: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"

  - id: rrs_climate_extended
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-climate
    wait: true
    transmitFailed: true
    inputs:
      source: extended
      run_clustering: false

  - id: rrs_insecurity_extended
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-insecurity
    wait: true
    transmitFailed: true
    inputs:
      source: extended
      run_clustering: false

  - id: rrs_pollution_extended
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-pollution
    wait: true
    transmitFailed: true
    inputs:
      source: extended
      run_detect_misinformation_rag: false
      run_clustering: false

  - id: barometre
    type: io.kestra.plugin.core.flow.Subflow
    namespace: quotaclimat
    flowId: barometre
    wait: true
    transmitFailed: true
    inputs:
      days_back: "{{ inputs.days_back }}"
      start_date: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"

  - id: rrs_climate
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-climate
    wait: true
    transmitFailed: true

  - id: rrs_insecurity
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-insecurity
    wait: true
    transmitFailed: true

  - id: rrs_pollution
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-pollution
    wait: true
    transmitFailed: true

  # last: the Metabase queries read tables of all the previous steps
  - id: metabase_sync
    type: io.kestra.plugin.core.flow.Subflow
    namespace: quotaclimat
    flowId: metabase-sync
    wait: true
    transmitFailed: true
    allowFailure: true
    inputs:
      apply: true
      force: true

# runs when a task above fails (not for metabase_sync, which has allowFailure)
errors:
  # one message per webhook of MATTERMOST_WEBHOOK_URLS (comma-separated), all sent in parallel
  # so that a dead webhook does not prevent the others from being notified
  - id: alert_mattermost
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ secret('MATTERMOST_WEBHOOK_URLS') | split(',') | toJson }}"
    concurrencyLimit: 0
    tasks:
      # plain HTTP call rather than the notifications plugin (not bundled in the Kestra image)
      - id: send
        type: io.kestra.plugin.core.http.Request
        uri: "{{ taskrun.value | trim }}"
        method: POST
        contentType: application/json
        body: |
          {%- set failed = (execution.taskRunList | jq('.[] | select(.state.current == "FAILED")') | first) -%}
          {%- set subflow_link = (failed.outputs.executionId is defined and vars.subflows[failed.taskId] is defined) ? (kestra.url ~ 'ui/main/executions/' ~ vars.subflows[failed.taskId] ~ '/' ~ failed.outputs.executionId) : '' -%}
          {{ {
            'username': 'Kestra',
            'text': 'main-pipeline failed at step `' ~ (failed.taskId ?? 'unknown') ~ '`.\nFailed subflow: ' ~ subflow_link ~ '\nExecution: ' ~ kestra.url ~ 'ui/main/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id
          } | toJson }}
