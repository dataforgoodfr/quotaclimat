id: main-pipeline
namespace: quotaclimat-dev

description: |
  Dev main pipeline. Runs the extended perimeter pipeline, processes it in RRS
  (without clustering), runs the dev OME `barometre` pipeline, then the RRS
  flows on the barometre source. Each step is a subflow that must succeed
  before the next one starts. No schedule in dev: run it manually.

labels:
  pipeline: ome
  environment: dev
  scope: france

inputs:
  - id: test_alert
    type: BOOLEAN
    defaults: false
    description: "When true, the first step is a subflow that always fails, to test the Mattermost alert. Nothing else runs."
  - id: with_rrs
    type: BOOLEAN
    defaults: true
    description: "When false, skips the extended perimeter and all RRS jobs and only runs barometre."
  - id: days_back
    type: INT
    defaults: 1
    description: Days prior to the start date to process. Defaults to 1.
  - id: start_date
    type: DATE
    required: false
    description: "Reference date (YYYY-MM-DD) from which to count days back. Defaults to now."

variables:
  # namespace/flowId of each subflow task, to link the failed one in the alert
  subflows:
    alert_test: quotaclimat-dev/alert-test
    extended_perimeter: rrs-dev/extended-perimeter
    rrs_climate_extended: rrs-dev/rrs-climate
    rrs_insecurity_extended: rrs-dev/rrs-insecurity
    rrs_pollution_extended: rrs-dev/rrs-pollution
    barometre: quotaclimat-dev/barometre
    rrs_climate: rrs-dev/rrs-climate
    rrs_insecurity: rrs-dev/rrs-insecurity
    rrs_pollution: rrs-dev/rrs-pollution

tasks:
  - id: alert_test
    runIf: "{{ inputs.test_alert }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: quotaclimat-dev
    flowId: alert-test
    wait: true
    transmitFailed: true

  - id: extended_perimeter
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: extended-perimeter
    wait: true
    transmitFailed: true
    inputs:
      days_back: "{{ inputs.days_back }}"
      start_date: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"

  - id: rrs_climate_extended
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: rrs-climate
    wait: true
    transmitFailed: true
    inputs:
      source: extended
      run_clustering: false

  - id: rrs_insecurity_extended
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: rrs-insecurity
    wait: true
    transmitFailed: true
    inputs:
      source: extended
      run_clustering: false

  - id: rrs_pollution_extended
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: rrs-pollution
    wait: true
    transmitFailed: true
    inputs:
      source: extended
      run_detect_misinformation_rag: false
      run_clustering: false

  - id: barometre
    type: io.kestra.plugin.core.flow.Subflow
    namespace: quotaclimat-dev
    flowId: barometre
    wait: true
    transmitFailed: true
    inputs:
      days_back: "{{ inputs.days_back }}"
      start_date: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"

  - id: rrs_climate
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: rrs-climate
    wait: true
    transmitFailed: true

  - id: rrs_insecurity
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: rrs-insecurity
    wait: true
    transmitFailed: true

  - id: rrs_pollution
    runIf: "{{ inputs.with_rrs }}"
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs-dev
    flowId: rrs-pollution
    wait: true
    transmitFailed: true

# runs when a task above fails
errors:
  # one message per webhook of MATTERMOST_WEBHOOK_URLS (comma-separated), all sent in parallel
  # so that a dead webhook does not prevent the others from being notified
  - id: alert_mattermost
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ secret('MATTERMOST_WEBHOOK_URLS') | split(',') | toJson }}"
    concurrencyLimit: 0
    tasks:
      # plain HTTP call rather than the notifications plugin (not bundled in the Kestra image)
      - id: send
        type: io.kestra.plugin.core.http.Request
        uri: "{{ taskrun.value | trim }}"
        method: POST
        contentType: application/json
        body: |
          {%- set failed_steps = outputs | jq('to_entries[] | select((.value | type) == "object" and (.value.state? == "FAILED")) | .key') -%}
          {%- set step = failed_steps | first -%}
          {%- set subflow_link = (step is not empty and outputs[step].executionId is defined and vars.subflows[step] is defined) ? (kestra.url ~ 'ui/main/executions/' ~ vars.subflows[step] ~ '/' ~ outputs[step].executionId) : '' -%}
          {{ {
            'username': 'Kestra',
            'text': '[dev] main-pipeline failed at step `' ~ (step ?? 'unknown') ~ '`.\nFailed subflow: ' ~ subflow_link ~ '\nExecution: ' ~ kestra.url ~ 'ui/main/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id
          } | toJson }}
