id: extended-perimeter
namespace: rrs-dev

description: |
  Dev pipeline to ingest the extended perimeter in the Droit à l'Info scope.

labels:
  pipeline: rrs
  environment: dev
  scope: france

tasks:
  - id: ingest_data_to_s3
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && python /app/quotaclimat/data_processing/mediatree/s3/api_to_s3.py
    shmSize: 10gb
    env: 
      API_TO_S3_CONCURRENCY: 10
      BUCKET_NAME: mediatree-extended-perimeter-dev
      COUNTRY: ext-fra
      ENV: prod
      KEYWORDS_URL: https://keywords.mediatree.fr/api/subtitle/
      LOGLEVEL: INFO
      MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
      MEDIATREE_USER: quotaclimat
      MODIN_CPUS: 2
      MODIN_ENGINE: python
      MODIN_MEMORY: 2000000000
      OMP_NUM_THREADS: 3
      PORT_HS: 5666
      BUCKET: "{{ secret('RRS_SCW_ACCESS_DEV') }}"
      BUCKET_SECRET: "{{ secret('RRS_SCW_SECRET_DEV') }}"
      MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"

  - id: detect_keywords
    logLevel: WARN          # filter per-row INFO spam at the Kestra level (UI freeze fix)
    shmSize: 2gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/namespace-barometre/quotaclimat_base:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/namespace-barometre
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && /app/entrypoints/detect_keywords.sh
    env:
      BATCH_SIZE: 5000
      BUCKET_NAME: mediatree-extended-perimeter-dev
      COMPARE_DURATION: true
      COUNTRY: ext-fra
      DBT_PROFILES_DIR: /app/my_dbt_project/dbt
      DBT_PROJECT_DIR: /app/my_dbt_project
      ENV: prod
      FILTER_DAYS_STOP_WORD: 3000
      HEALTHCHECK_SERVER: 0.0.0.0
      KEYWORDS_URL: https://keywords.mediatree.fr/api/v2/subtitle/
      LOGLEVEL: INFO
      MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
      MEDIATREE_USER: quotaclimat
      MODIN_CPUS: 2
      MODIN_ENGINE: ray
      MODIN_MEMORY: 2000000000
      POSTGRES_DB: extended-perimeter
      POSTGRES_PORT: 18047
      RAY_COLOR_PREFIX: 1
      RAY_memory_monitor_refresh_ms: 0
      BUCKET: "{{ secret('RRS_SCW_ACCESS_DEV') }}"
      BUCKET_SECRET: "{{ secret('RRS_SCW_SECRET_DEV') }}"
      MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
      POSTGRES_USER: "{{ secret('RRS_PG_USER_DEV') }}" # needs to be admin user to generate migrations
      POSTGRES_HOST: "{{ secret('RRS_PG_HOST_DEV') }}"
      POSTGRES_PASSWORD: "{{ secret('RRS_PG_PASSWORD_DEV') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
      EXTENDED_PERIMETER: true


  - id: detect_misinformation
    logLevel: WARN          # filter per-row INFO spam at the Kestra level (UI freeze fix)
    shmSize: 2gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/misinformation/label-misinformation:latest"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/misinformation
      username: nologin
      password: "{{ secret('SCW_SECRET') }}"
    entryPoint:
      - /bin/sh
      - -c
      - cd /app && python /app/main.py
    env: 
      APP_NAME: label-misinformation-extended-perimeter
      AWS_DEFAULT_REGION: fr-par
      COUNTRY: ext-fra
      ENV: production
      KEYWORDS_URL: https://keywords.mediatree.fr/api/v2/subtitle/
      LABEL_STUDIO_PROJECT: 6
      LABEL_STUDIO_PROJECT_ID: 4
      LABEL_STUDIO_URL: https://barometre7kfudatm-labelstudio.functions.fnc.fr-par.scw.cloud
      LOGLEVEL: INFO
      MEDIATREE_AUTH_URL: https://keywords.mediatree.fr/api/auth/token/
      MEDIATREE_USER: quotaclimat
      MODEL_NAME: ft:gpt-4o-mini-2024-07-18:personal::B1xWiJRm
      MODIN_MEMORY: 2000000000
      POSTGRES_DB: extended-perimeter
      POSTGRES_PORT: 18047
      RAY_COLOR_PREFIX: 1
      API_LABEL_STUDIO_KEY: "{{ secret('API_LABEL_STUDIO_KEY_DEV') }}"
      BUCKET_ACCESS: "{{ secret('RRS_SCW_ACCESS_DEV') }}"
      BUCKET_SECRET: "{{ secret('RRS_SCW_SECRET_DEV') }}"
      MEDIATREE_PASSWORD: "{{ secret('MEDIATREE_PASSWORD') }}"
      OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
      POSTGRES_USER: "{{ secret('RRS_PG_USER_DEV') }}"
      POSTGRES_HOST: "{{ secret('RRS_PG_HOST_DEV') }}"
      POSTGRES_PASSWORD: "{{ secret('RRS_PG_PASSWORD_DEV') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
      SAVE_TO_TARGET_DB: true

# ingest -> detect_keywords -> detect_misinformation

# Then add the detection in the extended perimeter in the respective perimeters
# pointing to the correct db.