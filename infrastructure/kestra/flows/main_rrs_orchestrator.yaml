id: rrs-orchestrator
namespace: rrs

description: |
  Morning orchestration. Runs the extended perimeter pipeline, processes it in
  RRS (without clustering), then runs the standard OME `barometre` pipeline.
  The completion of `barometre` fires the usual RRS chain
  (rrs-climate -> rrs-insecurity) through their flow triggers.
  The 12:30 `barometre` run is not part of this flow and stays standalone.

labels:
  pipeline: rrs
  environment: prod
  scope: france

inputs:
  - id: days_back
    type: INT
    defaults: 1
    description: Days prior to the start date to process. Defaults to 1.
  - id: start_date
    type: DATE
    required: false
    description: "Reference date (YYYY-MM-DD) from which to count days back. Defaults to now."

triggers:
  - id: morning_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "10 01 * * *"
    timezone: Europe/Paris

tasks:
  - id: extended_perimeter
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: extended-perimeter
    wait: true
    transmitFailed: true
    inputs:
      days_back: "{{ inputs.days_back }}"
      start_date: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"

  - id: rrs_climate_extended
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-climate
    wait: true
    transmitFailed: true
    labels:
      source: extended
    inputs:
      source: extended
      run_clustering: false

  - id: rrs_insecurity_extended
    type: io.kestra.plugin.core.flow.Subflow
    namespace: rrs
    flowId: rrs-insecurity
    wait: true
    transmitFailed: true
    labels:
      source: extended
    inputs:
      source: extended
      run_clustering: false

  # Its completion triggers rrs-climate -> rrs-insecurity on the barometre source.
  - id: barometre
    type: io.kestra.plugin.core.flow.Subflow
    namespace: quotaclimat
    flowId: barometre
    wait: true
    transmitFailed: true
    inputs:
      days_back: "{{ inputs.days_back }}"
      start_date: "{{ (inputs.start_date ?? now()) | date('yyyy-MM-dd') }}"
