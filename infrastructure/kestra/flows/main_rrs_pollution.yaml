id: rrs-pollution
namespace: rrs

description: |
  Chemical-pollution (environmental_health) pipeline for RRS: filters already-detected
  climate keywords down to the environmental_health dictionary, builds/refreshes the RAG
  expert-model index from source documents, runs the RAG fact-checking agent against the
  filtered segments, then clusters the resulting misinformation narratives.

labels:
  pipeline: rrs
  environment: prod
  scope: france

inputs:
  - id: source
    type: SELECT
    values:
      - barometre
      - extended
    defaults: barometre
    description: "Source database/perimeter to read from: the OME `barometre` DB or the `extended-perimeter` DB."
  - id: days_back
    type: INT
    required: true
    description: |
      Days prior to current date. Only applicable if `start_date` and `end_date` not set.
      If not set automatic logic will kick in.
    defaults: 1
  - id: start_date
    type: STRING
    required: false
    description: "Start of the analysis window (YYYY-MM-DD). Overrides days_back when set."
  - id: end_date
    type: STRING
    required: false
    description: "End of the analysis window (YYYY-MM-DD). Defaults to now when not set."
  - id: run_detect_misinformation_rag
    type: BOOLEAN
    required: true
    defaults: true
  - id: run_clustering
    type: BOOLEAN
    required: true
    defaults: true

tasks:
  - id: filter_keywords
    shmSize: 6gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/rrs-prod
      username: nologin
      password: "{{ secret('RRS_SCW_SECRET') }}"
    entryPoint:
      - python
      - -m
      - rrs.keyword_detection.filter_keywords
    env:
      PYTHONPATH: /app
      START_DATE: "{{ inputs.start_date ?? '' }}"
      END_DATE: "{{ inputs.end_date ?? '' }}"
      BUCKET_NAME: "{{ inputs.source == 'extended' ? 'mediatree-extended-perimeter-prod' : 'mediatree' }}"
      POSTGRES_DB: "{{ inputs.source == 'extended' ? 'extended-perimeter' : 'barometre' }}"
      POSTGRES_PORT: "{{ inputs.source == 'extended' ? 18492 : 22737 }}"
      RRS_PG_DATABASE: rrs
      RRS_PG_PORT: 18492
      POSTGRES_HOST: "{{ inputs.source == 'extended' ? secret('RRS_PG_HOST') : secret('POSTGRES_HOST') }}"
      POSTGRES_USER: "{{ secret('RRS_BAROMETRE_READ_USER') }}"
      POSTGRES_PASSWORD: "{{ secret('RRS_BAROMETRE_READ_PASSWORD') }}"
      RRS_PG_HOST: "{{ secret('RRS_PG_HOST') }}"
      RRS_PG_USER: "{{ secret('RRS_PG_USER') }}"
      RRS_PG_PASSWORD: "{{ secret('RRS_PG_PASSWORD') }}"
      SUBJECT: environmental_health

  - id: build_embeddings
    runIf: "{{ inputs.run_detect_misinformation_rag }}"
    shmSize: 6gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/rrs-prod
      username: nologin
      password: "{{ secret('RRS_SCW_SECRET') }}"
    entryPoint:
      - python
      - -m
      - rrs.rag.build_embeddings
    env:
      PYTHONPATH: /app
      SUBJECT: environmental_health
      EMBEDDINGS_BUCKET: "{{ secret('RRS_SCW_ACCESS') }}"
      EMBEDDINGS_BUCKET_SECRET: "{{ secret('RRS_SCW_SECRET') }}"
      EMBEDDINGS_BUCKET_NAME: expert-model-source-documents-prod
      MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"

  - id: detect_misinformation_rag
    runIf: "{{ inputs.run_detect_misinformation_rag }}"
    shmSize: 6gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/rrs-prod
      username: nologin
      password: "{{ secret('RRS_SCW_SECRET') }}"
    entryPoint:
      - python
      - -m
      - rrs.rag.run_rag_agent_mistral
    env:
      PYTHONPATH: /app
      START_DATE: "{{ inputs.start_date ?? '' }}"
      END_DATE: "{{ inputs.end_date ?? '' }}"
      DAYS_PRIOR: "{{ inputs.days_back ?? 1 }}"
      RRS_PG_DATABASE: rrs
      RRS_PG_PORT: 18492
      RRS_PG_HOST: "{{ secret('RRS_PG_HOST') }}"
      RRS_PG_USER: "{{ secret('RRS_PG_USER') }}"
      RRS_PG_PASSWORD: "{{ secret('RRS_PG_PASSWORD') }}"
      BUCKET_NAME: mediatree
      BUCKET: "{{ secret('SCW_ACCESS') }}"
      BUCKET_SECRET: "{{ secret('SCW_SECRET') }}"
      RRS_BUCKET: "{{ secret('RRS_SCW_ACCESS') }}"
      RRS_BUCKET_SECRET: "{{ secret('RRS_SCW_SECRET') }}"
      EMBEDDINGS_BUCKET: "{{ secret('RRS_SCW_ACCESS') }}"
      EMBEDDINGS_BUCKET_SECRET: "{{ secret('RRS_SCW_SECRET') }}"
      EMBEDDINGS_BUCKET_NAME: expert-model-source-documents-prod
      MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
      MISTRAL_MODEL: mistral-small-2603
      SUBJECT: environmental_health
      CONCURRENCY: 10

  - id: clustering
    runIf: "{{ inputs.run_clustering }}"
    shmSize: 6gb
    type: io.kestra.plugin.docker.Run
    containerImage: "rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod"
    pullPolicy: ALWAYS
    credentials:
      registry: rg.fr-par.scw.cloud/rrs-prod
      username: nologin
      password: "{{ secret('RRS_SCW_SECRET') }}"
    entryPoint:
      - python
      - -m
      - rrs.clustering.main
    env:
      PYTHONPATH: /app
      START_DATE: "{{ inputs.start_date ?? '' }}"
      END_DATE: "{{ inputs.end_date ?? '' }}"
      DAYS_PRIOR: "{{ inputs.days_back ?? '' }}"
      RRS_PG_DATABASE: rrs
      RRS_PG_PORT: 18492
      SPACY_MODEL: fr_core_news_sm
      WINDOW_SIZE: 3
      OVERLAP_TOKENS: 30
      PROVIDER: mistral
      LLM_MODEL: mistral-small-2603
      MAX_CONCURRENT_REQUESTS: 5
      MERGE_BATCH_SIZE: 30
      MERGE_MAX_ROUNDS: 5
      TARGET_CLUSTERS: 5
      MIN_CLUSTERS: 7
      MAX_CLUSTERS: 150
      CLUSTER_SCALE: 1.0
      LOW_THRESHOLD: 0.4
      HIGH_THRESHOLD: 0.85
      EMBEDDING_BACKEND: mistral
      EXPIRY_DAYS: 30
      OUTPUT_DIR: /app/output
      RRS_PG_HOST: "{{ secret('RRS_PG_HOST') }}"
      RRS_PG_USER: "{{ secret('RRS_PG_USER') }}"
      RRS_PG_PASSWORD: "{{ secret('RRS_PG_PASSWORD') }}"
      MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
      ANTHROPIC_API_KEY: "{{ secret('ANTHROPIC_API_KEY') }}"
      SENTRY_DSN: "{{ secret('SENTRY_DSN') }}"
      SUBJECT: environmental_health

# filter_keywords -> build_embeddings -> detect_misinformation_rag -> clustering
