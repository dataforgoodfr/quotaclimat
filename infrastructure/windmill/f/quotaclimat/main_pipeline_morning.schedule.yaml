summary: Main pipeline, night run (01:10)
description: Kestra trigger morning_schedule of quotaclimat/main-pipeline. Runs
  with the flow's default inputs, like Kestra. Cron with seconds first, Paris
  time.
args: {}
cron_version: v2
enabled: true
is_flow: true
no_flow_overlap: false
schedule: 0 10 1 * * *
script_path: f/quotaclimat/main_pipeline
timezone: Europe/Paris
ws_error_handler_muted: false
