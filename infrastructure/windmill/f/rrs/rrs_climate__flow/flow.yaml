summary: rrs/rrs-climate
description: |-
  Climate pipeline for RRS imports data from the OME database and performs clustering
  for audiovisual data sourced from Mediatree.
value:
  modules:
  - id: import_segments
    summary: import segments
    value:
      type: script
      path: f/shared/docker_run
      input_transforms:
        image:
          type: static
          value: rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod
        entrypoint:
          type: static
          value:
          - python
          - -m
          - rrs.keyword_detection.import_segments
        env:
          type: javascript
          expr: |-
            ({
              "PYTHONPATH": "/app",
              "START_DATE": flow_input.start_date ?? '',
              "END_DATE": flow_input.end_date ?? '',
              "BUCKET_NAME": flow_input.source === 'extended' ? 'mediatree-extended-perimeter-prod' : 'mediatree',
              "POSTGRES_DB": flow_input.source === 'extended' ? 'extended-perimeter' : 'barometre',
              "SOURCE_COUNTRY_CODE": flow_input.source === 'extended' ? 'ext-fra' : 'fra',
              "POSTGRES_PORT": flow_input.source === 'extended' ? 18492 : 22737,
              "RRS_PG_DATABASE": "rrs",
              "RRS_PG_PORT": 18492
            })
        secret_env:
          type: javascript
          expr: |-
            ({
              "BUCKET": "f/secrets/SCW_ACCESS",
              "BUCKET_SECRET": "f/secrets/SCW_SECRET",
              "POSTGRES_HOST": flow_input.source === 'extended' ? 'f/secrets/RRS_PG_HOST' : 'f/secrets/POSTGRES_HOST',
              "POSTGRES_USER": "f/secrets/RRS_BAROMETRE_READ_USER",
              "POSTGRES_PASSWORD": "f/secrets/RRS_BAROMETRE_READ_PASSWORD",
              "RRS_PG_HOST": "f/secrets/RRS_PG_HOST",
              "RRS_PG_USER": "f/secrets/RRS_PG_USER",
              "RRS_PG_PASSWORD": "f/secrets/RRS_PG_PASSWORD",
              "SENTRY_DSN": "f/secrets/SENTRY_DSN"
            })
        registry:
          type: static
          value: rg.fr-par.scw.cloud/rrs-prod
        registry_password_secret:
          type: static
          value: f/secrets/RRS_SCW_SECRET
        shm_size:
          type: static
          value: 6g
        stdout_logs:
          type: static
          value: true
  - id: import_cases
    summary: import cases
    value:
      type: script
      path: f/shared/docker_run
      input_transforms:
        image:
          type: static
          value: rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod
        entrypoint:
          type: static
          value:
          - python
          - -m
          - rrs.keyword_detection.import_cases
        env:
          type: javascript
          expr: |-
            ({
              "PYTHONPATH": "/app",
              "START_DATE": flow_input.start_date ?? '',
              "END_DATE": flow_input.end_date ?? '',
              "POSTGRES_DB": flow_input.source === 'extended' ? 'extended-perimeter' : 'barometre',
              "SOURCE_COUNTRY_CODE": flow_input.source === 'extended' ? 'ext-fra' : 'fra',
              "LABEL_STUDIO_PROJECT": flow_input.source === 'extended' ? 24 : 6,
              "LABEL_STUDIO_TAB_ID": flow_input.source === 'extended' ? 139 : 121,
              "POSTGRES_PORT": flow_input.source === 'extended' ? 18492 : 22737,
              "RRS_PG_DATABASE": "rrs",
              "RRS_PG_PORT": 18492
            })
        secret_env:
          type: javascript
          expr: |-
            ({
              "POSTGRES_HOST": flow_input.source === 'extended' ? 'f/secrets/RRS_PG_HOST' : 'f/secrets/POSTGRES_HOST',
              "POSTGRES_USER": "f/secrets/RRS_BAROMETRE_READ_USER",
              "POSTGRES_PASSWORD": "f/secrets/RRS_BAROMETRE_READ_PASSWORD",
              "RRS_PG_HOST": "f/secrets/RRS_PG_HOST",
              "RRS_PG_USER": "f/secrets/RRS_PG_USER",
              "RRS_PG_PASSWORD": "f/secrets/RRS_PG_PASSWORD",
              "SENTRY_DSN": "f/secrets/SENTRY_DSN"
            })
        registry:
          type: static
          value: rg.fr-par.scw.cloud/rrs-prod
        registry_password_secret:
          type: static
          value: f/secrets/RRS_SCW_SECRET
        shm_size:
          type: static
          value: 6g
        stdout_logs:
          type: static
          value: true
  - id: clustering
    summary: clustering
    value:
      type: script
      path: f/shared/docker_run
      input_transforms:
        image:
          type: static
          value: rg.fr-par.scw.cloud/rrs-prod/rrs-base:prod
        entrypoint:
          type: static
          value:
          - python
          - -m
          - rrs.clustering.main
        env:
          type: javascript
          expr: |-
            ({
              "PYTHONPATH": "/app",
              "START_DATE": flow_input.start_date ?? '',
              "END_DATE": flow_input.end_date ?? '',
              "DAYS_PRIOR": flow_input.days_back ?? '',
              "RRS_PG_DATABASE": "rrs",
              "RRS_PG_PORT": 18492,
              "SPACY_MODEL": "fr_core_news_sm",
              "WINDOW_SIZE": 3,
              "OVERLAP_TOKENS": 30,
              "PROVIDER": "mistral",
              "LLM_MODEL": "mistral-small-2603",
              "MAX_CONCURRENT_REQUESTS": 5,
              "MERGE_BATCH_SIZE": 30,
              "MERGE_MAX_ROUNDS": 5,
              "TARGET_CLUSTERS": 5,
              "MIN_CLUSTERS": 7,
              "MAX_CLUSTERS": 150,
              "CLUSTER_SCALE": 1.0,
              "LOW_THRESHOLD": 0.4,
              "HIGH_THRESHOLD": 0.85,
              "EMBEDDING_BACKEND": "mistral",
              "EXPIRY_DAYS": 30,
              "OUTPUT_DIR": "/app/output",
              "SUBJECT": "climate"
            })
        secret_env:
          type: static
          value:
            RRS_PG_HOST: f/secrets/RRS_PG_HOST
            RRS_PG_USER: f/secrets/RRS_PG_USER
            RRS_PG_PASSWORD: f/secrets/RRS_PG_PASSWORD
            MISTRAL_API_KEY: f/secrets/MISTRAL_API_KEY
            ANTHROPIC_API_KEY: f/secrets/ANTHROPIC_API_KEY
            SENTRY_DSN: f/secrets/SENTRY_DSN
        registry:
          type: static
          value: rg.fr-par.scw.cloud/rrs-prod
        registry_password_secret:
          type: static
          value: f/secrets/RRS_SCW_SECRET
        shm_size:
          type: static
          value: 6g
        stdout_logs:
          type: static
          value: true
    skip_if:
      expr: '!(flow_input.run_clustering)'
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
  - source
  - days_back
  - start_date
  - end_date
  - run_clustering
  properties:
    source:
      type: string
      enum:
      - barometre
      - extended
      description: 'Source database/perimeter to read from: the OME `barometre` DB or the `extended-perimeter` DB.'
      default: barometre
    days_back:
      type: integer
      description: "Days prior to current date. Only applicable if `start_date` and `end_date` not set. \nIf not set automatic\
        \ logic will kick in."
    start_date:
      type: string
      description: Start of the analysis window (YYYY-MM-DD). Overrides days_back when set.
    end_date:
      type: string
      description: End of the analysis window (YYYY-MM-DD). Defaults to now when not set.
    run_clustering:
      type: boolean
      default: true
  required:
  - source
  - run_clustering
