
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_dbt_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'my_dbt_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# +grants only grant select on the tables: the readers of the curated tables also need usage on the curated
# schema (created by dbt), see macros/grant_schema_usage.sql
on-run-end:
  - "{{ grant_schema_usage(results, ['curated']) }}"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  my_dbt_project:
    # Config indicated by + and applies to all files under models/example/
    analytics:
      +grants: &analytics_grants
        # grant nothing in dev; set DBT_ENV=prod to enable grants in prod
        # the extended-perimeter DB only has a rrs-read-{dev,prod} user (no climateguard-reader-user,
        # no metabase-analytics-{dev,prod}), so when EXTENDED_PERIMETER is true, grant only to the
        # rrs-read user matching DBT_ENV
        select: "{{ (['\"rrs-read-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"']) if env_var('EXTENDED_PERIMETER', 'false') == 'true' else (['\"rrs-read-dev\"', '\"rrs-read-prod\"', '\"climateguard-reader-user\"', '\"metabase-analytics-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"', '\"metabase-analytics-dev\"']) }}"
    dashboards:
      +grants:
        # grant nothing in dev; set DBT_ENV=prod to enable grants in prod
        # the extended-perimeter DB only has a rrs-read-{dev,prod} user (no climateguard-reader-user,
        # no metabase-analytics-{dev,prod}), so when EXTENDED_PERIMETER is true, grant only to the
        # rrs-read user matching DBT_ENV
        select: "{{ (['\"rrs-read-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"']) if env_var('EXTENDED_PERIMETER', 'false') == 'true' else (['\"climateguard-reader-user\"', '\"metabase-analytics-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"', '\"metabase-analytics-dev\"']) }}"
    advertising:
      # built next to the ad tables (created by alembic), see macros/generate_schema_name.sql
      +schema: advertising
      +grants: &advertising_grants
        # same grants as analytics models
        select: "{{ (['\"rrs-read-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"']) if env_var('EXTENDED_PERIMETER', 'false') == 'true' else (['\"rrs-read-dev\"', '\"rrs-read-prod\"', '\"climateguard-reader-user\"', '\"metabase-analytics-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"', '\"metabase-analytics-dev\"']) }}"
    homepage:
      +materialized: view
      # same grants as analytics models
      +grants: *analytics_grants
    metadata:
      # same grants as analytics models
      +grants: *analytics_grants
    # clean tables for the teams and their Claude (Metabase MCP), see models/curated/_curated.yml:
    # built after entrypoints/dbt.sh by entrypoints/curated.sh, as tables so that rebuilding the models they read does not drop them,
    # columns frozen by the contract, docs written as Postgres comments and pushed to Metabase
    # (quotaclimat/metabase/sync_curated.py)
    curated:
      +schema: curated
      +materialized: table
      +contract:
        enforced: true
      +persist_docs:
        relation: true
        columns: true
      +grants: *analytics_grants


seeds:
  my_dbt_project:
    # reference data downloaded from Google Sheets (quotaclimat/data_ingestion/external_sources),
    # always loaded with `dbt seed --full-refresh --select path:seeds/ref`
    ref:
      +quote_columns: true
      # next to the advertising models, see macros/generate_schema_name.sql
      +schema: advertising
      +grants: *advertising_grants

    # methodology seeds versioned in the repository, read by the analytics models,
    # always loaded with `dbt seed --full-refresh --select path:seeds/themes`
    themes:
      +schema: public
      +grants: *analytics_grants

    # snapshots of the source tables for local/test data only. They have the names of the production tables
    # (public.keywords, public.program_metadata...), so seeding them replaces those tables (drop ... cascade with
    # --full-refresh). Disabled unless DBT_ENABLE_FIXTURE_SEEDS=true (docker compose test/testconsole, CI): a
    # `dbt seed` or `dbt build` without --select against the production database only loads seeds/ref and seeds/themes.
    # Fail closed: the target name does not tell production apart (production runs with the `docker` target).
    fixtures:
      +enabled: "{{ env_var('DBT_ENABLE_FIXTURE_SEEDS', 'false') == 'true' }}"
      keywords:
        post-hook:
          - "ALTER TABLE keywords ADD PRIMARY KEY (id,start)"
          - "ALTER TABLE keywords ALTER COLUMN program_metadata_id TYPE text"
