# Reference data from private Google Sheets, downloaded as dbt seeds before `dbt run`, by
# quotaclimat/data_ingestion/external_sources/download_external_sources.py, then loaded by
# `dbt seed --full-refresh --select path:seeds/ref` (see entrypoints/dbt.sh).
#
# The spreadsheets are looked up by name in a Google Drive folder, shared as viewer with the Google
# service account whose JSON key is in GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON. Only the folder id
# is kept out of the repo, in the env variable named by `folder_env`. A spreadsheet readable without
# credentials is refused.
#
# Each source:
#   name:          identifier, used in logs
#   folder_env:    env variable holding the Drive folder id (last part of https://drive.google.com/drive/folders/<id>)
#   spreadsheet:   exact name of the spreadsheet in that folder (exactly one match expected)
#   table_prefix:  every tab becomes the seed / table <table_prefix><tab name in snake_case>, must start
#                  with ref_ (e.g. "catégories" -> ref_ome_categories)
#   sheets:        optional per-tab settings, keyed by the exact tab name:
#                    table:   table name instead of the default one (must start with ref_)
#                    skip:    true to not download this tab
#
# Column types and tests of the seeds: my_dbt_project/seeds/ref/_ref_seeds.yml.

sources:
  # brand dictionary and sector / category taxonomy of the ad classification pipeline
  - name: ome_dictionnaire_marques_secteurs
    folder_env: EXTERNAL_SOURCES_DRIVE_FOLDER
    spreadsheet: OME_dictionnaire_marques_secteurs
    table_prefix: ref_ome_
