# Reference data from private Google Sheets, downloaded as dbt seeds before `dbt run`, by
# quotaclimat/data_ingestion/external_sources/download_external_sources.py, then loaded by
# `dbt seed --full-refresh --no-partial-parse --select path:seeds/ref` (see entrypoints/dbt.sh).
#
# The spreadsheets are looked up by name in a Google Drive folder, shared as viewer with the Google
# service account whose JSON key is in GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON. Only the folder id
# is kept out of the repo, in the env variable named by `folder_env`. A spreadsheet readable without
# credentials is refused.
#
# Each source:
#   name:          identifier, used in logs
#   folder_env:    env variable holding the Drive folder id (last part of https://drive.google.com/drive/folders/<id>)
#   spreadsheet:   exact name of the spreadsheet in that folder (exactly one match expected)
#   table_prefix:  every tab (except the ones whose name starts with "_", for humans only) becomes the seed / table <table_prefix><tab name in snake_case>, must start
#                  with ref_ (e.g. "catégories" -> ref_ome_categories)
#   sheets:        optional per-tab settings, keyed by the exact tab name:
#                    table:   table name instead of the default one (must start with ref_)
#                    skip:    true to not download this tab
#                    columns: optional {header in the sheet: column name}: only these columns are written, renamed,
#                             in this order (a configured header missing from the tab leaves its table unchanged)
#
# Column types and tests of the seeds: my_dbt_project/seeds/ref/_ref_seeds.yml.

sources:
  # brand dictionary and sector / category taxonomy of the ad classification pipeline
  - name: ome_dictionnaire_marques_secteurs
    folder_env: EXTERNAL_SOURCES_DRIVE_FOLDER
    spreadsheet: Dictionnaire_marques_secteurs
    table_prefix: ref_ome_

  # brand -> company and ultimate parent company (tab Marques, the ultimate parent only used when checked
  # by a human), see my_dbt_project/models/advertising/ad_brands.sql
  - name: inventaire_des_marques
    folder_env: EXTERNAL_SOURCES_DRIVE_FOLDER
    spreadsheet: Inventaire_des_marques
    table_prefix: ref_inventaire_
    sheets:
      Marques:
        table: ref_inventaire_marques

  # media agency of each advertiser (company, optionally a brand of it): tab agence_entreprise ->
  # ref_annonceurs_agence_entreprise, see my_dbt_project/models/advertising/ad_brand_agencies.sql
  - name: inventaire_des_annonceurs
    folder_env: EXTERNAL_SOURCES_DRIVE_FOLDER
    spreadsheet: Inventaire_des_annonceurs
    table_prefix: ref_annonceurs_

  # programs grids by emission (my_dbt_project/models/analytics/program.sql): tab
  # emissions-infos-en-continue -> ref_programmes_emissions_infos_en_continue (24h news channels)
  - name: programmes
    folder_env: EXTERNAL_SOURCES_DRIVE_FOLDER
    spreadsheet: Programmes
    table_prefix: ref_programmes_

  # misinformation cases of 2026 linked to their targets ("cibles") and the targets to the ad product categories
  # they attack, for the analysis of the ads around the cases: base data only, the matching is done by dbt
  # (my_dbt_project/models/analytics/cas_affirmation_cible.sql, cas_categorie_visee.sql). The computed tabs
  # (matrices, par_cas, 4_cas_categories) and the fine grid are not downloaded; the transcripts of
  # 1_affirmations neither (only the columns listed are kept, renamed)
  - name: cas_de_mesinfo
    folder_env: EXTERNAL_SOURCES_DRIVE_FOLDER
    spreadsheet: Cas_de_mesinfo
    table_prefix: ref_cas_
    sheets:
      Lisez-moi:
        skip: true
      2_grille:
        skip: true
      2_matrice:
        skip: true
      3_matrice_binaire:
        skip: true
      par_cas:
        skip: true
      4_cas_categories:
        skip: true
      0_cibles:
        table: ref_cas_cibles
        columns:
          Code: cible_code
          Cible: cible
          Famille: famille
          Catégorie OMÉ (rapport 2025): categorie_ome
          Ce qu'elle couvre: perimetre
          Sens le plus courant: sens_reference
      1_affirmations:
        table: ref_cas_affirmations
        columns:
          id affirmation: affirmation_id
          Identifiant du cas: task_aggregate_id
          Affirmation: affirmation
          # one column per target: "attaque", "défend" or empty, unpivoted by cas_affirmation_cible
          ENR: enr
          Prix élec.: prx
          Nucléaire: nuc
          Fossiles: fos
          VE: ve
          Thermique: vt
          Politiques auto: pau
          Aérien: aer
          Vélo / mobilités douces: vel
          Train / collectifs: trc
          Rénovation: bat
          Clim: clim
          Élevage: elv
          Pesticides / irrigation: agr
          Science: sci
          Messagers: mes
          Rôle FR / politiques: rol
          Explication (debunk): explication
      3_grille_binaire:
        table: ref_cas_grille_binaire
        columns:
          Cible (code): cible_code
          # direction of the claims on the target for which the category is attacked: a claim attacks the
          # category only when it goes this direction (cas_categorie_visee)
          Sens de référence: sens
          Code catégorie: cat_code
          Produit visé (1 = attaqué): produit_vise
          Analyse: analyse
