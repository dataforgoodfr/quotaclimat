# External reference data loaded into Postgres (schema public) before `dbt run`,
# by quotaclimat/data_ingestion/external_sources/load_external_sources.py (called in entrypoints/dbt.sh).
#
# Each source:
#   name:          identifier, used in logs and in the public.ref_external_source_load history table
#   type:          spreadsheet (Google Sheet, every tab loaded) or csv (single file)
#   url_env:       environment variable holding the link (preferred: keeps the link out of this public repo)
#   url:           link used when url_env is not set: Google Sheet (any /edit link works) or CSV (URL or local path)
#
# spreadsheet only:
#   table_prefix:  every tab is loaded into <table_prefix><tab name in snake_case>
#                  (e.g. "Catégories" -> ref_classification_pub_ome_categories)
#   sheets:        optional per-tab settings, keyed by the exact tab name:
#                    table:   table name instead of the default one
#                    columns: columns that must be present (extra columns are kept)
#                    unique:  columns that must be non-empty and unique together
#                    skip:    true to not load this tab
# csv only:
#   table, columns, unique: same as the per-tab settings above
#
# The sheet must be shared by link (viewer). When no link is configured, the source is skipped. When the download or the validation of a tab fails,
# its table is left unchanged. Declare the tables as dbt sources to use them in models.

sources:
  - name: classification_pub_ome
    type: spreadsheet
    url_env: CLASSIFICATION_PUB_OME_SHEET_URL
    table_prefix: ref_classification_pub_ome_
    sheets:
      secteurs:
        columns: [sector_code, sector_label_fr]
        unique: [sector_code]
      catégories:
        columns: [sector_code, cat_code, product_category_fr]
        unique: [cat_code]
