version: 2

sources:
  - name: advertising
    schema: advertising
    tables:
      - name: ad
      - name: ad_occurrence
      # Sector / product category reference: dbt seeds downloaded from the classification Google Sheet
      # before dbt runs (see my_dbt_project/external_sources.yml), built in this schema
      - name: ad_sectors
        identifier: ref_ome_secteurs
      - name: ad_categories
        identifier: ref_ome_categories
      # Brand / group inventory: dbt seeds downloaded from the Inventaires_des_marques Google Sheet
      # (tabs Marques and Groupes), built in this schema
      - name: brand_inventory
        identifier: ref_inventaire_marques
      - name: group_inventory
        identifier: ref_inventaire_groupes

  - name: public
    schema: public
    tables:
      - name: program_metadata

  # built by the `--target analytics` run, before the advertising models (see entrypoints/dbt.sh)
  - name: analytics
    schema: analytics
    tables:
      - name: task_global_completion
