version: 2

models:
  - name: homepage_environment_by_media_by_month
    description: "Aggregated environmental data with monthly averages"
    columns:
      - name: start
        description: "Month/Year"
        tests:
          - not_null

      - name: avg
        description: "Average environmental percentage"
        tests:
          - not_null

      - name: channel_title
        description: "Channel_Title"
        tests:
          - not_null


  - name: core_query_environmental_shares
    description: >
      Environmental shares data pulled from core_query_environmental_shares, 
      including climate and biodiversity metrics by program/channel.
    columns:
      - name: start
        description: Start date or timestamp of the observation.
      - name: channel_title
        description: 'Original: Program Metadata - Channel Name__channel_title'
      - name: public
        description: 'Original: Program Metadata - Channel Name__public'
      - name: infocontinue
        description: 'Original: Program Metadata - Channel Name__infocontinue'
      - name: radio
        description: 'Original: Program Metadata - Channel Name__radio'
      - name: environnement_total_pct
        description: 'Original: % environnement total'
      - name: climat_pct
        description: 'Original: % climat'
      - name: climat_cause_pct
        description: 'Original: % climat cause'
      - name: climat_solutions_adaptation_pct
        description: 'Original: % climat solutions adaptation '
      - name: climat_consequences_pct
        description: 'Original: % climat consequences'
      - name: climat_solutions_attenuation_pct
        description: 'Original: % climat solutions attenuation'
      - name: climat_constat_pct
        description: 'Original: % climat constat'
      - name: biodiversite_pct
        description: 'Original: % biodiversite'
      - name: biodiversite_constat_pct
        description: 'Original: % biodiversité constat'
      - name: biodiversite_solutions_pct
        description: 'Original: % biodiversité solutions'
      - name: biodiversite_consequences_pct
        description: 'Original: % biodiversité conséquences'
      - name: biodiversite_causes_pct
        description: 'Original: % biodiversité causes'
      - name: ressources_pct
        description: 'Original: % ressources'
      - name: ressources_constat_pct
        description: 'Original: % ressources constat'
      - name: ressources_solutions_pct
        description: 'Original: % ressources solutions'

  - name: core_query_environmental_shares_i8n
    description: >
      International Environmental shares data pulled from core_query_environmental_shares, 
      including climate and biodiversity metrics by program/channel.
    columns:
      - name: start
        description: Start date or timestamp of the observation.
      - name: channel_title
        description: 'Original: Program Metadata - Channel Name__channel_title'
      - name: public
        description: 'Original: Program Metadata - Channel Name__public'
      - name: infocontinue
        description: 'Original: Program Metadata - Channel Name__infocontinue'
      - name: radio
        description: 'Original: Program Metadata - Channel Name__radio'
      - name: environnement_total_pct
        description: 'Original: % environnement total'
      - name: climat_pct
        description: 'Original: % climat'
      - name: climat_cause_pct
        description: 'Original: % climat cause'
      - name: climat_solutions_adaptation_pct
        description: 'Original: % climat solutions adaptation '
      - name: climat_consequences_pct
        description: 'Original: % climat consequences'
      - name: climat_solutions_attenuation_pct
        description: 'Original: % climat solutions attenuation'
      - name: climat_constat_pct
        description: 'Original: % climat constat'
      - name: biodiversite_pct
        description: 'Original: % biodiversite'
      - name: biodiversite_constat_pct
        description: 'Original: % biodiversité constat'
      - name: biodiversite_solutions_pct
        description: 'Original: % biodiversité solutions'
      - name: biodiversite_consequences_pct
        description: 'Original: % biodiversité conséquences'
      - name: biodiversite_causes_pct
        description: 'Original: % biodiversité causes'
      - name: ressources_pct
        description: 'Original: % ressources'
      - name: ressources_constat_pct
        description: 'Original: % ressources constat'
      - name: ressources_solutions_pct
        description: 'Original: % ressources solutions'

  - name: core_query_thematics_keywords
    description: >
      Thematic keyword analysis by channel and week, 
      including crisis type, theme, and keyword frequency.
    columns:
      - name: channel_title
        description: Title of the broadcast channel.
      - name: week
        description: Week of the observation (likely in YYYY-WW format).
      - name: crise_type
        description: Type of crisis being referenced.
      - name: theme
        description: Thematic category associated with the keyword.
      - name: category
        description: Sub-category or secondary classification for the keyword.
      - name: keyword
        description: The keyword identified in the broadcast or transcript.
      - name: count
        description: Count of lines or mentions related to the keyword
      - name: sum_duration_minutes_week
        description: Number of program minutes for the week

  - name: core_query_thematics_keywords_i8n
    description: >
      International thematic keyword analysis by channel and week, 
      including crisis type, theme, and keyword frequency.
    columns:
      - name: channel_title
        description: Title of the broadcast channel.
      - name: week
        description: Week of the observation (likely in YYYY-WW format).
      - name: crise_type
        description: Type of crisis being referenced.
      - name: theme
        description: Thematic category associated with the keyword.
      - name: category
        description: Sub-category or secondary classification for the keyword.
      - name: keyword
        description: The keyword identified in the broadcast or transcript.
      - name: count
        description: Count of lines or mentions related to the keyword.
      - name: country
        description: country

  - name: task_global_completion
    description: "Aggregates data between the labelstudio tasks and the labelstudio task completions."
    columns:
      - name: task_aggregate_id
        description: "Unique ID for the aggregated task. Generated from a hash of task_id, project_id and country"
      - name: created_at
        description: "Creation timestamp"
      - name: updated_at
        description: "Update timestamp"
      - name: is_labeled
        description: "Boolean, has the task been labeled "
      - name: project_id
        description: "Project ID for the country in the original labelstudio instance."
      - name: country
        description: "name of the country of origin"
      - name: data_item_id
        description: "ID from keywords "
      - name: data_item_channel
        description: "Channel ID"
      - name: data_item_channel_name
        description: "Channel name lowercase"
      - name: data_item_channel_title
        description: "Name of Channel properly formatted"
      - name: data_item_channel_program
        description: "Name of program from which the chunk is extracted"
      - name: data_item_channel_program_type
        description: "Type of program (news, opinion, continuous news, talk show)"
      - name: data_item_day
        description: "Day of month"
      - name: data_item_month
        description: "Month of year"
      - name: data_item_year
        description: "Year of the segment"
      - name: data_item_model_name
        description: "Name of model used for the classification"
      - name: data_item_model_reason
        description: "Model reason for classification or model probability score"
      - name: data_item_model_result
        description: "Model classification"
      - name: data_item_plaintext
        description: "Segment transcript obtained from mediatree"
      - name: data_item_plaintext_whisper
        description: "Segment transcript obtained from the speech-to-text model."
      - name: data_item_start
        description: "Start timestamp for the segment"
      - name: data_item_url_mediatree
        description: "Mediatree url with link to the video"
      - name: mesinfo_choice
        description: "Choice between correct and incorrect. Note this applies to the model's classification: Correct = Misinformation and Incorrect = Not Misinformation"
      - name: locuteur_choice
        description: "Speaker types identified"
      - name: mesinfo_correct
        description: "One hot encoding mesinfo correct"
      - name: mesinfo_incorrect
        description: "One hot encoding mesinfo incorrect"
      - name: speaker_journalist
        description: "One hot encoding speaker journalist"
      - name: speaker_commentator
        description: "One hot encoding speaker commentator"
      - name: speaker_guest
        description: "One hot encoding speaker guest"
      - name: speaker_politician
        description: "One hot encoding speaker politician"
      - name: speaker_audience
        description: "One hot encoding speaker audience"
      - name: speaker_unknown
        description: "One hot encoding speaker unknown"
      - name: "Annotation Version"
        description: "Annotation version (first annotation=1, second annotation=2)"
      - name: sum_duration_minutes
        description: "Total weekly durations (minutes) for the program being annotated"
      - name: weekly_perc_climat
        description: "% Time the of sum_duration_minutes being dedicated to climate change"

  - name: environmental_shares_with_desinfo_counts
    columns:
      - name: "start"
        description: "Start of week timestamp."
      - name: channel_title	
        description: "Name of Channel properly formatted."
      - name: channel_name	
        description: "Name of Channel."
      - name: sum_duration_minutes
        description: "Total weekly durations (minutes) for the channel on a given week."
      - name: weekly_perc_climat
        description: "% Time the of sum_duration_minutes being dedicated to climate change."
      - name: country
        description: "Country of channel."
      - name: total_mesinfo
        description: "Total instances of misinformation detected."

  - name: core_query_environmental_shares_be
    description: >
        International environmental shares (Belgium). Denominator is the effectively
        monitored time: restricted to declared program slots for channels with an
        editorial grid (program_metadata), full time_monitored for channels without one.
    columns:
        - name: start
          description: Start of the ISO week of the observation (week truncated).
        - name: channel_name
          description: Technical channel identifier, join key with program_metadata and time_monitored.
        - name: channel_title
          description: Human-readable channel name, resolved from keywords.
        - name: country
          description: Country of the channel (belgium).
        - name: has_grid
          description: >
            True when the channel has an editorial grid in program_metadata. Indicates which
            denominator rule applies (in-perimeter captured minutes vs full time_monitored).
        - name: sum_duration_minutes
          description: >
            Effective denominator in minutes. In-perimeter captured minutes when has_grid is
            true, total time_monitored otherwise.
        - name: sum_time_monitored
          description: >
            Control column. Total minutes ingested by Mediatree (captured chunks x 2 min),
            regardless of the editorial grid.
        - name: sum_monitored_in_perimeter_min
          description: >
            Control column. Minutes captured within declared program slots. Only populated
            for channels with a grid. The gap with sum_time_monitored measures
            out-of-perimeter ingestion.
        - name: environnement_total_pct
          description: 'Original: % environnement total'
        - name: climat_pct
          description: 'Original: % climat'
        - name: climat_cause_pct
          description: 'Original: % climat cause'
        - name: climat_solutions_adaptation_pct
          description: 'Original: % climat solutions adaptation'
        - name: climat_consequences_pct
          description: 'Original: % climat consequences'
        - name: climat_solutions_attenuation_pct
          description: 'Original: % climat solutions attenuation'
        - name: climat_constat_pct
          description: 'Original: % climat constat'
        - name: biodiversite_pct
          description: 'Original: % biodiversite'
        - name: biodiversite_constat_pct
          description: 'Original: % biodiversité constat'
        - name: biodiversite_solutions_pct
          description: 'Original: % biodiversité solutions'
        - name: biodiversite_consequences_pct
          description: 'Original: % biodiversité conséquences'
        - name: biodiversite_causes_pct
          description: 'Original: % biodiversité causes'
        - name: ressources_pct
          description: 'Original: % ressources'
        - name: ressources_constat_pct
          description: 'Original: % ressources constat'
        - name: ressources_solutions_pct
          description: 'Original: % ressources solutions'

  - name: core_query_thematics_keywords_be
    description: >
      International thematic keyword occurrences (Belgium), one row per week, channel,
      category, theme and keyword. Only meaningful when keyword, theme and category are
      read together, since a keyword present in several themes appears once per theme.
      Shares the denominator definition of core_query_environmental_shares_i8n.
    columns:
      - name: channel_title
        description: Human-readable channel name, resolved from keywords.
      - name: channel_name
        description: Technical channel identifier, join key with program_metadata and time_monitored.
      - name: country
        description: Country of the channel (belgium).
      - name: week
        description: Start of the ISO week of the occurrence (week truncated).
      - name: has_grid
        description: >
          True when the channel has an editorial grid in program_metadata. Indicates which
          denominator rule applies.
      - name: category
        description: Keyword category from the dictionary, defaulted to Transversal when empty.
      - name: high_risk_of_false_positive
        description: Dictionary flag marking keywords prone to false positives (HRFP).
      - name: is_solution
        description: True when the theme refers to solutions.
      - name: is_consequence
        description: True when the theme refers to consequences.
      - name: is_cause
        description: True when the theme refers to causes.
      - name: is_general_concepts
        description: True when the theme refers to general concepts.
      - name: is_statement
        description: True when the theme refers to a constat (statement of fact).
      - name: crise_type
        description: >
          Crisis family derived from the theme. One of Crise climatique,
          Crise de la biodiversité, Crise des ressources, Autre.
      - name: theme
        description: Raw theme of the keyword occurrence. Indirect themes are excluded upstream.
      - name: keyword
        description: Detected keyword.
      - name: general
        description: Macro-category flag from keyword_macro_category.
      - name: agriculture
        description: Macro-category flag from keyword_macro_category.
      - name: transport
        description: Macro-category flag from keyword_macro_category.
      - name: batiments
        description: Macro-category flag from keyword_macro_category.
      - name: energie
        description: Macro-category flag from keyword_macro_category.
      - name: industrie
        description: Macro-category flag from keyword_macro_category.
      - name: eau
        description: Macro-category flag from keyword_macro_category.
      - name: ecosysteme
        description: Macro-category flag from keyword_macro_category.
      - name: economie_ressources
        description: Macro-category flag from keyword_macro_category.
      - name: count
        description: Number of keyword occurrences for the group.
      - name: sum_duration_minutes
        description: >
          Effective denominator in minutes for the week and channel. In-perimeter captured
          minutes when has_grid is true, total time_monitored otherwise. Repeated on every
          row of the group, so it must be aggregated with MAX or MIN, never SUM.
      - name: sum_time_monitored
        description: >
          Control column. Total minutes ingested by Mediatree for the week and channel.
          Repeated on every row of the group.
      - name: sum_monitored_in_perimeter_min
        description: >
          Control column. Minutes captured within declared program slots for the week and
          channel. Repeated on every row of the group.
  - name: ad_occurrences_classified
    description: >
      One row per ad occurrence whose ad went through the classification pipeline
      (dictionary match or sub-category LLM step), enriched with channel metadata
      from program_metadata and French sector / product category labels from the
      classification reference table.
      Only occurrences from ad_analysis_start_date (dbt var, default 2025-09-29, UTC) onwards.
    columns:
      - name: occurrence_id
        description: Identifier of the occurrence (advertising.ad_occurrence.id).
        tests:
          - unique
          - not_null
      - name: occurrence_date
        description: Broadcast timestamp of the occurrence.
      - name: channel_name
        description: Technical channel identifier, join key with program_metadata.
      - name: ad_id
        description: Identifier of the ad (advertising.ad.id).
      - name: tunnel_id
        description: >
          Ad tunnel the occurrence belongs to (see ad_tunnels). NULL for OTHER fragments,
          which are not part of tunnels.
        tests:
          - relationships:
              arguments:
                to: ref('ad_tunnels')
                field: tunnel_id
      - name: duration_sec
        description: Duration of the ad in seconds.
      - name: prediction_status
        description: Step of the classification pipeline that produced the prediction.
      - name: sector_label_fr
        description: French label of the predicted sector.
      - name: product_category_fr
        description: French label of the predicted product category.
      - name: label_final
        description: Product category label when available, sector label otherwise.
      - name: brand_company
        description: >
          Company that sells under the predicted brand (see ad_brands.brand_company), the predicted brand
          itself when it is not in ad_brands. NULL when no brand was predicted.
      - name: brand_ultimate_parent
        description: >
          Ultimate parent company of the company of the predicted brand (see ad_brands.brand_ultimate_parent),
          the predicted brand itself when it is not in ad_brands. NULL when no brand was predicted.
      - name: brand_company_label
        description: >
          brand_company for reading (see ad_brands.brand_company_label), its alias when it has one. The
          column to group by: companies with the same alias are one company.
      - name: brand_ultimate_parent_label
        description: brand_ultimate_parent for reading (see ad_brands.brand_ultimate_parent_label), its alias when it has one.
      - name: mesinfo_distance_sec
        description: >
          Distance in seconds (absolute value) to the nearest validated misinformation on the same
          channel (see ad_occurrence_mesinfo). NULL when there is none within ad_mesinfo_window_days.
      - name: nearest_mesinfo_task_aggregate_id
        description: Label Studio task (analytics.task_global_completion.task_aggregate_id) of that misinformation.
      - name: inside_program
        description: The ad tunnel of the occurrence is entirely inside a monitored program (see ad_tunnel_programs).
      - name: program_before
        description: Monitored program in progress or just before the ad tunnel (see ad_tunnel_programs).
      - name: program_before_type
        description: Type of program_before.
      - name: program_before_gap_sec
        description: Seconds between the end of program_before and the tunnel start, 0 when in progress.
      - name: program_after
        description: Monitored program just after the ad tunnel, empty when the tunnel is inside program_before.
      - name: program_after_type
        description: Type of program_after.
      - name: program_after_gap_sec
        description: Seconds between the tunnel end and the start of program_after, 0 when it starts during the tunnel.

  - name: ad_tunnel_programs
    description: >
      One row per ad tunnel (see ad_tunnels) with the monitored programs around it, from the French
      program grids of program_metadata (Paris local time, only the monitored programs, not the full
      grid of the channel). program_before: last program started before the tunnel start, in progress
      or ended at most ad_program_window_minutes (dbt var, default 60) before. program_after: first
      program started after the tunnel start, at most ad_program_window_minutes after the tunnel end,
      left empty when the tunnel is entirely inside program_before. Occurrence dates are read in the
      ad_occurrence_timezone time zone (dbt var, default UTC).
    columns:
      - name: tunnel_id
        description: Tunnel identifier (ad_tunnels.tunnel_id).
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('ad_tunnels')
                field: tunnel_id
      - name: inside_program
        description: The tunnel is entirely inside program_before.
        tests:
          - not_null
      - name: program_before
        description: Name of the program before (program_metadata.channel_program).
      - name: program_before_type
        description: Type of the program before (program_metadata.channel_program_type).
      - name: program_before_gap_sec
        description: Seconds between the end of the program before and the tunnel start, 0 when in progress.
      - name: program_after
        description: Name of the program after.
      - name: program_after_type
        description: Type of the program after.
      - name: program_after_gap_sec
        description: Seconds between the tunnel end and the start of the program after, 0 when it starts during the tunnel.

  - name: ad_occurrence_mesinfo
    description: >
      One row per non-deleted ad occurrence (from ad_analysis_start_date) with a validated
      misinformation on the same channel at most ad_mesinfo_window_days (dbt var, default 7) days
      before or after it: the nearest one. Validated misinformation: analytics.task_global_completion
      rows with mesinfo_choice = 'Correct', first annotation ("Annotation Version" = 1), France.
      Both occurrence_date and data_item_start are compared as is (timestamps without time zone, UTC).
    columns:
      - name: occurrence_id
        description: Identifier of the occurrence (advertising.ad_occurrence.id).
        tests:
          - unique
          - not_null
      - name: nearest_mesinfo_task_aggregate_id
        description: Label Studio task of the nearest validated misinformation.
        tests:
          - not_null
      - name: mesinfo_distance_sec
        description: Distance in seconds (absolute value) between the occurrence and the misinformation start.
        tests:
          - not_null

  - name: ad_brands
    description: >
      Brand reference, built from the Inventaires_des_marques Google Sheet only (no ad table): one row per
      brand of the tab Marques, with the company that sells under the brand (rows not verified allowed) and
      the ultimate parent company of the company (tab Entreprises, used only when verified). Used by
      ad_occurrences_classified.
    columns:
      - name: brand_key
        description: >
          Join key of the brand: accents stripped, lower case, punctuation and spaces removed (macro
          name_key, same as the Python classification pipeline).
        tests:
          - unique
          - not_null
      - name: brand
        description: Brand as written in the tab Marques (column marque).
      - name: inventory_company
        description: Company of the brand as written in the tab Marques (column entreprise), NULL when empty.
      - name: brand_company_source
        description: Source of the company (column source of the tab Marques, e.g. inpi, wikidata, gleif, off, llm, manuel).
      - name: brand_company_status
        description: vérifié or non vérifié (column statut of the tab Marques).
      - name: company_in_inventory
        description: >
          True when the company written in the tab Marques is in the tab Entreprises (name_key comparison).
          False when the company must be added to the tab Entreprises or corrected in the tab Marques.
      - name: company_alias
        description: >
          Short name of the company for reading the results (column alias of the tab Entreprises, optional),
          e.g. Belron for Belron International Limited. NULL when empty.
      - name: company_id
        description: Identifier of the company (column entreprise_id of the tab Entreprises, e.g. LEI or Wikidata QID).
      - name: ultimate_parent_verified
        description: True when the row of the company in the tab Entreprises is verified (statut 'vérifié').
      - name: verified_ultimate_parent
        description: >
          Ultimate parent company of the company (column societe_mere_ultime of the tab Entreprises), only
          when its row is verified.
      - name: brand_company
        description: >
          Official name of the company (column entreprise of the tab Entreprises), else the company as
          written in the tab Marques, else the brand itself.
      - name: brand_ultimate_parent
        description: verified_ultimate_parent, else brand_company.
      - name: brand_company_label
        description: >
          company_alias, else brand_company. For reading and grouping the results: companies with the same
          alias are one company; brand_company keeps the official name.
      - name: brand_ultimate_parent_label
        description: >
          Alias of the ultimate parent when it is itself a company of the tab Entreprises (name_key
          comparison), else brand_ultimate_parent.

  - name: ad_occurrence_tunnels
    description: >
      One row per non-OTHER, non-deleted ad occurrence with the ad tunnel it belongs to.
      An ad tunnel is a sequence of consecutive fragments on a channel, where each one starts
      at most ad_tunnel_tolerance_sec (default 5) seconds after the end of the previous ones;
      overlapping fragments stay in the same tunnel.
    columns:
      - name: occurrence_id
        description: Identifier of the occurrence (advertising.ad_occurrence.id).
        tests:
          - unique
          - not_null
      - name: tunnel_id
        description: Tunnel identifier, built as channel_name@epoch_of_tunnel_start_date (seconds).
        tests:
          - not_null
      - name: channel_name
        description: Technical channel identifier.
      - name: start_date
        description: Start of the occurrence.
      - name: end_date
        description: End of the occurrence (start + ad duration).

  - name: ad_tunnels
    description: >
      Ad tunnels, one row per tunnel, aggregated from ad_occurrence_tunnels (see its
      description for the tunnel definition).
    columns:
      - name: tunnel_id
        description: Tunnel identifier, built as channel_name@epoch_of_start_date (seconds).
        tests:
          - unique
          - not_null
      - name: channel_name
        description: Technical channel identifier.
      - name: start_date
        description: Start of the first fragment of the tunnel.
      - name: end_date
        description: End of the last fragment of the tunnel.

  - name: program_emissions
    description: >
      One row per emission and per day of the 24h news channels, from the Programmes Google Sheet (tab
      emissions-infos-en-continue, seed ref_programmes_emissions_infos_en_continue): the weekday column
      ('*', 'weekday', 'weekend' or days 1 to 7 separated by '|') is split into one row per day. With the
      channel attributes and the monitored program (program_metadata) the emission is broadcast in: the
      program of the same channel and day overlapping the emission the most, on the most recent grid.
    columns:
      - name: id
        description: md5 of channel_name, weekday, start and grid_start.
        tests:
          - unique
          - not_null
      - name: channel_name
        description: Technical channel identifier, as in program_metadata (e.g. bfmtv, itele).
        tests:
          - not_null
      - name: channel_title
        description: Channel name (program_metadata), NULL when the channel is not in program_metadata.
        tests:
          - not_null:
              config:
                severity: warn
      - name: country
        description: Country of the channel (program_metadata).
      - name: public
        description: Public service channel (program_metadata).
      - name: infocontinue
        description: 24h news channel (program_metadata).
      - name: radio
        description: Radio channel (program_metadata).
      - name: weekday
        description: Day of the emission, 1 (Monday) to 7 (Sunday), like program_metadata.weekday.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: emission
        description: Name of the emission.
      - name: presentation
        description: Presenters, as written in the sheet.
      - name: rediffusion
        description: True for a rerun (column rediffusion 'oui').
      - name: start
        description: Start time HH:MM (Paris time), as written in the sheet.
      - name: end
        description: End time HH:MM (Paris time), 24:00 for midnight, as written in the sheet.
      - name: duration_minutes
        description: Duration of the emission in minutes, NULL when a time is invalid.
      - name: grid_start
        description: First day the row is valid, NULL when not filled in (no lower bound).
      - name: grid_end
        description: Last day the row is valid, 2100-01-01 when not filled in.
      - name: program_metadata_id
        description: >
          program_metadata.id of the program the emission is broadcast in, NULL when it overlaps no
          monitored program (e.g. after 23:00 on the news channels).
      - name: channel_program
        description: Name of that program (program_metadata.channel_program).
      - name: channel_program_type
        description: Type of that program (program_metadata.channel_program_type).
      - name: program_start
        description: Start time of that program.
      - name: program_end
        description: End time of that program.
      - name: program_overlap_minutes
        description: Minutes of the emission inside that program (monitored minutes), 0 when none.
