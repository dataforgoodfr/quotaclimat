version: 2

# Reference seeds downloaded from private Google Sheets (see my_dbt_project/external_sources.yml).
# The CSV files are not versioned: they are written by download_external_sources before
# `dbt seed --select path:seeds/ref`. Column types are inferred by dbt, except identifiers that must
# stay text (e.g. a code "001" would otherwise become the number 1).

seeds:
  - name: ref_ome_secteurs
    config:
      column_types:
        sector_code: text
        # Nice classes of the trademarks of the sector, e.g. "3; 32" (brand groups job), text even when a
        # single class; ignored by dbt when the column does not exist
        classes_nice: text
    columns:
      - name: sector_code
        tests:
          - unique
          - not_null
      - name: sector_label_fr
        tests:
          - not_null

  - name: ref_ome_categories
    config:
      column_types:
        sector_code: text
        cat_code: text
    columns:
      - name: cat_code
        tests:
          - unique
          - not_null
      - name: sector_code
        tests:
          - not_null
      - name: product_category_fr
        tests:
          - not_null

  # Inventaire_des_marques spreadsheet, tab Marques: brand -> company (with its SIREN and the department of
  # its head office) -> ultimate parent company, and the ultimate majority shareholder, each value used
  # unless its status is 'à vérifier'
  - name: ref_inventaire_marques
    config:
      # all text, even when a column looks numeric (e.g. the brand "1664") or is still empty
      column_types:
        marque: text
        entreprise: text
        # text: leading zeros of the SIREN ("005520135") and departments "01", "2A"
        siren: text
        departement_siege_social: text
        societe_mere_ultime: text
        e_statut: text
        smu_statut: text
        actionnaire_maj_ultime: text
        amu_statut: text
        commentaires: text
    columns:
      - name: marque
        tests:
          - unique
          - not_null
      - name: e_statut
        tests:
          - accepted_values:
              arguments:
                values: ['vérifié', 'non vérifié', 'à vérifier']
      - name: smu_statut
        tests:
          - accepted_values:
              arguments:
                values: ['vérifié', 'non vérifié', 'à vérifier']
      - name: amu_statut
        tests:
          - accepted_values:
              arguments:
                values: ['vérifié', 'non vérifié', 'à vérifier']

  # Inventaire_des_annonceurs spreadsheet, tab agence_entreprise: media agency of each company (marque empty),
  # or of one brand of a company whose agency differs (marque filled), read by advertising.ad_brand_agencies
  - name: ref_annonceurs_agence_entreprise
    config:
      # all text: dates are AAAA-MM or AAAA, the optional columns may still be empty
      column_types:
        entreprise: text
        marque: text
        agence_media: text
        groupe_agence: text
        fiabilite: text
        perimetre_geo: text
        perimetre_media: text
        autres_agences: text
        agence_precedente: text
        date_info: text
        verifie_le: text
        note: text
        source_1: text
        source_2: text
        source_3: text
        maj_le: text
        maj_par: text
    tests:
      # one row per company and brand (empty brand included), compared as the model joins them
      - unique_name_keys:
          arguments:
            columns: ['entreprise', 'marque']
    columns:
      - name: entreprise
        tests:
          - not_null
      - name: groupe_agence
        tests:
          - accepted_values:
              arguments:
                values: ['Havas', 'Publicis', 'WPP', 'Omnicom', 'Dentsu', 'Indépendant', 'Interne']
      - name: fiabilite
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['confirmee', 'probable', 'indice', 'inconnue']
      - name: perimetre_geo
        tests:
          - accepted_values:
              arguments:
                values: ['France', 'Europe', 'Monde']
      - name: perimetre_media
        tests:
          - accepted_values:
              arguments:
                values: ['tout', 'partiel']
      - name: date_info
        tests:
          - matches_pattern:
              arguments:
                pattern: '^[0-9]{4}(-[0-9]{2})?$'
      - name: verifie_le
        tests:
          - matches_pattern:
              arguments:
                pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

  # Programmes spreadsheet, tab emissions-infos-en-continue: one row per emission of the 24h news
  # channels and per set of days, turned into one row per emission and per day by analytics.program
  - name: ref_programmes_emissions_infos_en_continue
    config:
      # all text, parsed by analytics.program (e.g. weekday "5", time "06:00")
      column_types:
        channel_name: text
        emission: text
        presentation: text
        weekday: text
        start: text
        end: text
        rediffusion: text
        grid_start: text
        grid_end: text
    columns:
      - name: channel_name
        tests:
          - not_null
      - name: emission
        tests:
          - not_null
      - name: weekday
        tests:
          - not_null
          # *, weekday, weekend or days 1 (Monday) to 7 (Sunday) separated by |, like program_metadata.weekday
          - matches_pattern:
              arguments:
                pattern: '^ *(\*|weekday|weekend|[1-7]( *\| *[1-7])*) *$'
      - name: start
        tests:
          - not_null
          - matches_pattern:
              arguments:
                pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
      - name: end
        quote: true
        tests:
          - not_null
          # 24:00 for midnight
          - matches_pattern:
              arguments:
                pattern: '^(([01]?[0-9]|2[0-3]):[0-5][0-9]|24:00)$'
      - name: rediffusion
        tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']
      - name: grid_start
        tests:
          - matches_pattern:
              arguments:
                pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{2}/[0-9]{2}/[0-9]{4})$'
      - name: grid_end
        tests:
          - matches_pattern:
              arguments:
                pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{2}/[0-9]{2}/[0-9]{4})$'
