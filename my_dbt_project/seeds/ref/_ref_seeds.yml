version: 2

# Reference seeds downloaded from private Google Sheets (see my_dbt_project/external_sources.yml).
# The CSV files are not versioned: they are written by download_external_sources before
# `dbt seed --select path:seeds/ref`. Column types are inferred by dbt, except identifiers that must
# stay text (e.g. a code "001" would otherwise become the number 1).

seeds:
  - name: ref_ome_secteurs
    config:
      column_types:
        sector_code: text
    columns:
      - name: sector_code
        tests:
          - unique
          - not_null
      - name: sector_label_fr
        tests:
          - not_null

  - name: ref_ome_categories
    config:
      column_types:
        sector_code: text
        cat_code: text
    columns:
      - name: cat_code
        tests:
          - unique
          - not_null
      - name: sector_code
        tests:
          - not_null
      - name: product_category_fr
        tests:
          - not_null

  # Inventaires_des_marques spreadsheet, tab Marques: brand -> group, rows not verified allowed
  - name: ref_inventaire_marques
    config:
      # all text, even when a column looks numeric (e.g. the brand "1664") or is still empty
      column_types:
        marque: text
        groupe: text
        source: text
        statut: text
        commentaire: text
    columns:
      - name: marque
        tests:
          - unique
          - not_null
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['vérifié', 'non vérifié']

  # Inventaires_des_marques spreadsheet, tab Groupes: group -> ultimate parent company, only the
  # rows with statut 'vérifié' are used
  - name: ref_inventaire_groupes
    config:
      column_types:
        groupe: text
        alias: text
        groupe_id: text
        societe_mere_ultime: text
        source: text
        statut: text
        commentaire: text
    columns:
      - name: groupe
        tests:
          - unique
          - not_null
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['vérifié', 'non vérifié']
