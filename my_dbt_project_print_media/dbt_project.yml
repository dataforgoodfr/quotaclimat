name: 'dbt_print_media'
version: '1.0.0'

profile: 'dbt_print_media'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_print_media:
    dashboards:
      +materialized: incremental
      +grants:
        # grant nothing in dev; set DBT_ENV=prod to enable grants in prod
        select: "{{ (['\"climateguard-reader-user\"', '\"metabase-analytics-prod\"'] if env_var('DBT_ENV', 'dev') == 'prod' else ['\"rrs-read-dev\"', '\"metabase-analytics-dev\"']) }}"
