[project]
name = "quotaclimat"
version = "2.1.217"
description = ""
authors = [
    {name = "Rambier Estelle", "email"="estelle.rambier@hotmail.fr"},
    {name = "Paul Leclercq", "email"="paul@epauler.fr"},
    {name = "Giuseppe Guarino", "email"="giuseppe@dataforgood.fr"},
    {name = "Vincent Mateos", "email"="vincent.mateos1@gmail.com"}
]
readme = "README.md"

[tool.pytest.ini_options]
log_cli = 1
log_cli_level = "INFO"
testpaths = [
    "test"
]
addopts = "--durations=0"

[tool.poetry.dependencies]
s3fs = {extras = ["boto3"], version = ">=2023.12.0"}
boto3 = "*"
botocore = "*"
python = ">=3.11,<=3.13"
s3transfer = "0.10.4"
pandas = "^2.2.3"
advertools = "^0.14.1"
xmltodict = "^0.13.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.5"
alembic = "^1.13.1"
beautifulsoup4 = "^4.11.1"
asyncio = "^3.4.3"
tomli = "^2.0.1"
aiohttp = "^3.10.8"
pytest-asyncio = "^0.23.5"
swifter = "^1.4.0"
tenacity = "^8.2.3"
sentry-sdk = ">=2.53.0"
modin = {extras = ["ray"], version = "^0.32.0"}
openpyxl = "^3.1.5"
requests = "^2.32.3"
thefuzz = "^0.22.1"
dbt-core = "^1.9.2"
dbt-postgres = "^1.9.0"
ruff = "^0.13.3"
graphviz = "^0.21"
matplotlib = "^3.10.7"
factiva-analytics = "^0.3.0"
python-dotenv = "^1.2.1"
google-cloud-pubsub = "^2.33.0"
google-auth = "^2.55.1"


plotly = "^6.5.0"
nbformat = "^5.10.4"
kaleido = "^1.2.0"
librosa = "^0.11.0"
numpy = "^2.4.2"
scipy = "^1.17.1"
soundfile = "^0.13.1"
duckdb = "^1.4.4"
scikit-learn = "^1.8.0"
pyahocorasick = "^2.3.0"
spacy = "^3.8.11"
openai = "^2.33.0"
pydantic-settings = "^2.14.0"
[build-system]
requires = ["poetry-core>=1.1"]
build-backend = "poetry.core.masonry.api"



[tool.poetry.group.dev.dependencies]
coverage = "^7.5.4"
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
pytest-env = "^1.1.3"
poetry-bumpversion = "^0.3.1"
pre-commit = "^2.18.1"
black = "^22.3.0"
isort = "^5.10.1"
flake8 = "^4.0.1"
invoke = "^1.7.3"
deptry = "^0.20.0"
graphviz = "^0.21"
ipykernel = "^7.0.1"
ipywidgets = "^8.1.8"
dotenv = "^0.9.9"

[tool.poetry.group.rrs]
optional = true

[tool.poetry.group.rrs.dependencies]
torch = {version = ">=2.0", source = "pytorch-cpu"}
transformers = ">=5.0"
anthropic = "^0.102.0"
psycopg = {version = ">=3.0", extras = ["binary"]}
sentence-transformers = ">=3.0"
sentencepiece = ">=0.2"
openpyxl = ">=3.1"
mistralai = "^2.5.0"
mcp = "^1.28.1"
griffe = "^2.1.0"
pymupdf = "^1.26.4"

# Pulsar themes pipeline — API-key-based, no browser automation.
# Kept as a separate optional group so it doesn't bloat rrs-base.
[tool.poetry.group.pulsar]
optional = true

[tool.poetry.group.pulsar.dependencies]
psycopg = {version = ">=3.0", extras = ["binary"]}
requests = "^2.32.3"
tenacity = "^8.2.3"
python-dotenv = ">=1.0"
tzdata = "^2026.2"
openpyxl = "^3.1.5"
mistralai = "^2.5.0"
mcp = "^1.28.1"
griffe = "^2.1.0"
tqdm = "^4.67.1"

# detect_misinformation/jobs/label_misinformation — misinformation labelling job
# (image built with `poetry install --only misinformation`).
[tool.poetry.group.misinformation]
optional = true

[tool.poetry.group.misinformation.dependencies]
boto3 = "*"
s3fs = {extras = ["boto3"], version = ">=2025.2.0"}
modin = {extras = ["ray"], version = ">=0.32.0"}
ray = ">=2.42.1"
pandas = ">=2.2.3"
numpy = ">=2.2.3"
pyarrow = ">=19.0.1"
sqlalchemy = ">=2.0.38"
psycopg2-binary = ">=2.9.10"
requests = ">=2.32.3"
pydantic = ">=2.11.2"
mistralai = ">=2.9.1"
openai = "*"
moviepy = ">=2.1.2"
sentry-sdk = ">=2.53.0"
tomli = ">=2.4.1"
pyyaml = ">=6.0.2"
tqdm = ">=4.67.1"
pytest = ">=8.3.4"
pytest-mock = ">=3.14.0"
# Used by the shadow pipeline's sentence splitter (shadow image adds the rrs group for torch/transformers).
llama-index-core = "*"

# detect_misinformation/jobs/get_audio_video — Germany audio/video collector.
[tool.poetry.group.germany-audio-video-collector]
optional = true

[tool.poetry.group.germany-audio-video-collector.dependencies]
google-cloud-storage = ">=2.0.0"
google-auth = ">=2.0.0"
google-auth-oauthlib = "*"
google-api-python-client = ">=2.0.0"
moviepy = ">=1.0.0"
sqlalchemy = ">=2.0.0"
pandas = ">=2.0.0"
psycopg2-binary = ">=2.9.0"
requests = ">=2.28.0"

# detect_misinformation/experiments — research / fine-tuning environment.
# torch comes from the pytorch-cpu source (one torch entry in the lock for every group):
# on a GPU machine, install CUDA torch over the venv (see detect_misinformation/experiments/README.md).
[tool.poetry.group.misinformation-dev]
optional = true

[tool.poetry.group.misinformation-dev.dependencies]
accelerate = ">=1.10.1"
datasets = ">=4.1.1"
evaluate = ">=0.4.6"
ipykernel = ">=6.30.1"
ipywidgets = ">=8.1.7"
jupyter = ">=1.1.1"
keybert = ">=0.9.0"
numpy = ">=2.3.3"
ollama = ">=0.6.0"
openai = ">=1.108.1"
# climateguard asked for >=2.3.2, but main's modin ^0.32 caps pandas <2.3.
pandas = ">=2.2.3"
peft = ">=0.17.1"
plotly = ">=6.5.0"
protobuf = ">=6.32.1"
psutil = ">=7.1.0"
psycopg = {version = ">=3.3.3", extras = ["binary"]}
psycopg2-binary = ">=2.9.11"
python-dotenv = ">=1.1.1"
requests = ">=2.32.5"
rouge-score = ">=0.1.2"
ruff = ">=0.13.1"
scikit-learn = ">=1.7.2"
sentencepiece = ">=0.2.1"
setfit = ">=1.1.3"
torch-optimi = ">=0.3.2"
torch = {version = ">=2.10.0", source = "pytorch-cpu"}
transformers = ">=5.5"
trl = ">=0.23.1"
wandb = ">=0.22.2"
wordcloud = ">=1.9.4"
tomli = ">=2.4.1"
pymupdf = ">=1.28.0"
# climateguard asked for >=0.121.0, but the rrs group pins ^0.102.0 (one resolution for all groups).
anthropic = "^0.102.0"
mistralai = ">=2.9.1"
openpyxl = ">=3.1.5"

[tool.poetry.group.misinformation-dev-cuda]
optional = true

[tool.poetry.group.misinformation-dev-cuda.dependencies]
bitsandbytes = ">=0.50.0"
unsloth = ">=2026.6.1"
mistralai = ">=2.5.0"
pydantic = ">=2.11.9"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest_env]
CLEAN_CACHE_ON_EXIT=true
GLOBAL_CACHE_FOLDER=".test_cache"
