<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuotaClimat — Split Visualizer</title>
  <style>
    :root {
      --bg: #0c0c18;
      --surface: #161628;
      --surface2: #1e1e36;
      --surface3: #28284a;
      --border: #2a2a4a;
      --primary: #00d2a0;
      --primary-dim: #00805f;
      --accent: #f0c040;
      --accent-dim: #a08020;
      --danger: #e05050;
      --text: #e8ecf2;
      --text2: #b8c2d4;
      --text3: #8890a8;
      --radius: 6px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    /* ─── Header ─────────────────────────────────────── */
    #header {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 20px;
      position: sticky; top: 0; z-index: 100;
    }
    #logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    #logo .q { color: var(--primary); }
    #logo .c { color: var(--accent); }
    #header-info { font-size: 12px; color: var(--text2); }

    /* ─── Metadata ───────────────────────────────────── */
    .meta-section {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; padding: 16px 20px;
    }
    .meta-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
    }
    .meta-card h3 {
      font-size: 13px; color: var(--primary);
      margin-bottom: 8px; letter-spacing: 0.5px;
    }
    .meta-card.side-b h3 { color: var(--accent); }
    .meta-table { width: 100%; font-size: 12px; }
    .meta-table td { padding: 3px 8px; }
    .meta-table td:first-child { color: var(--text3); white-space: nowrap; }
    .meta-table td:last-child { font-family: var(--mono); text-align: right; }

    /* ─── Charts ─────────────────────────────────────── */
    .charts-section { padding: 8px 20px; }
    .chart-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 10px;
    }
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
    }
    .chart-container h4 {
      font-size: 11px; color: var(--text3);
      margin-bottom: 4px; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chart-container.side-a h4 span.side-label { color: var(--primary); }
    .chart-container.side-b h4 span.side-label { color: var(--accent); }
    canvas { width: 100%; border-radius: 3px; display: block; }

    /* ─── Tables ─────────────────────────────────────── */
    .tables-section {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; padding: 0 20px 12px;
    }
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
    }
    .table-card h4 {
      font-size: 12px; color: var(--text2); margin-bottom: 6px;
    }
    .table-card table { width: 100%; font-size: 11px; border-collapse: collapse; }
    .table-card th {
      text-align: left; color: var(--text3); font-weight: 600;
      padding: 4px 6px; border-bottom: 1px solid var(--border);
    }
    .table-card td {
      padding: 3px 6px; font-family: var(--mono); border-bottom: 1px solid rgba(42,42,74,0.4);
    }
    .table-card tbody { display: block; max-height: 220px; overflow-y: auto; }
    .table-card thead, .table-card tbody tr { display: table; width: 100%; table-layout: fixed; }
    .row-accepted { color: var(--primary); }
    .row-dropped { color: var(--danger); }

    /* ─── Params ─────────────────────────────────────── */
    .params-section {
      padding: 12px 20px;
      font-size: 11px; color: var(--text3);
    }
    .params-section details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
    }
    .params-section summary { cursor: pointer; color: var(--text2); }
    .params-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 4px 16px; margin-top: 8px;
    }
    .params-grid span { font-family: var(--mono); }

    /* ─── Legend ──────────────────────────────────────── */
    .legend {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding: 8px 20px; font-size: 11px; color: var(--text3);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-swatch { width: 24px; height: 3px; border-radius: 2px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-zone { width: 24px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.15); }

    /* ─── Audio Player ────────────────────────────────── */
    .audio-section {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; padding: 4px 20px 8px;
    }
    .audio-player {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .audio-player.side-a { border-color: var(--primary-dim); }
    .audio-player.side-b { border-color: var(--accent-dim); }
    .audio-player-row { display: flex; align-items: center; gap: 10px; }
    .play-btn {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 4px 10px;
      flex-shrink: 0;
    }
    .play-btn:hover { background: var(--surface2); }
    .audio-player.side-a .play-btn { color: var(--primary); }
    .audio-player.side-b .play-btn { color: var(--accent); }
    .time-display {
      font-family: var(--mono); font-size: 11px; color: var(--text3);
      flex-shrink: 0; min-width: 100px;
    }
    .seek-bar { flex: 1; cursor: pointer; height: 4px; accent-color: var(--primary); }
    .audio-player.side-b .seek-bar { accent-color: var(--accent); }
    .audio-label { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .audio-player.side-a .audio-label { color: var(--primary); }
    .audio-player.side-b .audio-label { color: var(--accent); }

    /* ─── Playhead overlay ────────────────────────────── */
    .canvas-wrapper { position: relative; cursor: crosshair; }
    .playhead {
      position: absolute; top: 0; bottom: 0;
      width: 2px; background: rgba(255,255,255,0.85);
      pointer-events: none; display: none;
      transform: translateX(-50%);
      z-index: 2;
    }
  </style>
</head>

<body>
  <div id="header">
    <div id="logo"><span class="q">Quota</span><span class="c">Climat</span> — Split Visualizer (e02)</div>
    <div id="header-info"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-zone" style="background:rgba(0,210,160,0.10)"></div> Zone d'un chunk retenu</div>
    <div class="legend-item"><div class="legend-dot" style="background:#60d080"></div> Pic accepté (frontière de chunk)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e06060"></div> Pic candidat rejeté (espacement minimum)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#f0c040"></div> Seuil de silence local</div>
    <div class="legend-item"><div class="legend-zone" style="background:rgba(255,255,255,0.08)"></div> Marge réservée (segment précédent/suivant)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ffffff;height:1px;border-top:1px dashed #ffffff"></div> Timestamp investigué</div>
  </div>

  <div class="meta-section" id="meta-section"></div>
  <div class="audio-section" id="audio-section"></div>
  <div class="charts-section" id="charts-section"></div>
  <div class="tables-section" id="tables-section"></div>
  <div class="params-section" id="params-section"></div>

  <script id="embedded-data" type="application/json">null</script>

  <script>
    "use strict";

    const DATA = JSON.parse(document.getElementById("embedded-data").textContent);
    const A = DATA.windowA;
    const B = DATA.windowB;
    const PARAMS = DATA.params;

    // ── Utilities ──────────────────────────────────────
    function isoStr(iso) { return iso; }
    function fmt(v, decimals = 4) {
      if (v === null || v === undefined) return "—";
      return Number(v).toFixed(decimals);
    }

    // ── Header info ────────────────────────────────────
    document.getElementById("header-info").textContent =
      `SR: ${PARAMS.sr} Hz | min_chunk_sec: ${PARAMS.min_chunk_sec}s | silence_percentile: ${PARAMS.silence_percentile}`;

    // ── Metadata cards ─────────────────────────────────
    function buildMetaCard(win, side) {
      const cls = side === "b" ? "meta-card side-b" : "meta-card";
      return `<div class="${cls}">
        <h3>${win.label} — ${win.channel}</h3>
        <table class="meta-table">
          <tr><td>Segment</td><td style="font-size:11px">${win.segmentStart} → ${win.segmentEnd}</td></tr>
          <tr><td>Window duration</td><td>${fmt(win.duration, 2)} s</td></tr>
          <tr><td>Displayed range</td><td>${win.focusSec !== null ? `zoom ±${fmt((win.waveformDuration)/2, 1)}s around focus` : `${fmt(win.waveformDuration, 2)} s from start`}</td></tr>
          <tr><td>has_previous_segment</td><td>${win.hasPreviousSegment}</td></tr>
          <tr><td>has_next_segment</td><td>${win.hasNextSegment}</td></tr>
          <tr><td>Candidate peaks</td><td>${win.regionCandidates.length}</td></tr>
          <tr><td>Accepted peaks</td><td>${win.keptPeaksSec.length}</td></tr>
          <tr><td>Dropped peaks</td><td>${win.droppedCandidates.length}</td></tr>
          <tr><td>Chunks produced</td><td>${win.chunks.length}</td></tr>
        </table>
      </div>`;
    }
    document.getElementById("meta-section").innerHTML =
      buildMetaCard(A, "a") + buildMetaCard(B, "b");

    // ── Chart drawing ──────────────────────────────────
    const CHART_H = 130;
    const SPEC_H = 170;
    const COLORS = { a: "#00d2a0", b: "#f0c040" };
    const BG = "#12122a";

    function createCanvas(w, h) {
      const c = document.createElement("canvas");
      const dpr = window.devicePixelRatio || 1;
      c.width = w * dpr;
      c.height = h * dpr;
      c.style.width = w + "px";
      c.style.height = h + "px";
      const ctx = c.getContext("2d");
      ctx.scale(dpr, dpr);
      return { canvas: c, ctx, w, h };
    }

    function timeToX(t, tMax, w) { return (t / tMax) * w; }

    function drawMarginZones(ctx, win, tMax, w, h) {
      // Reserved margin at the start (covered by the previous job)
      if (win.hasPreviousSegment) {
        const x = timeToX(win.reservedSec, tMax, w);
        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.fillRect(0, 0, x, h);
      }
      // Beyond the cutoff, chunk starts belong to the next job
      const xCut = timeToX(win.chunkStartCutoffSec, tMax, w);
      if (xCut < w) {
        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.fillRect(xCut, 0, w - xCut, h);
      }
    }

    function drawChunkZones(ctx, win, tMax, w, h) {
      win.chunks.forEach((c, i) => {
        const x0 = timeToX(c.startSec, tMax, w);
        const x1 = timeToX(c.endSec, tMax, w);
        ctx.fillStyle = i % 2 === 0 ? "rgba(0,210,160,0.08)" : "rgba(0,210,160,0.04)";
        ctx.fillRect(x0, 0, x1 - x0, h);
      });
      // Boundary lines at accepted peaks
      ctx.strokeStyle = "rgba(96,208,128,0.7)";
      ctx.lineWidth = 1.2;
      for (const p of win.keptPeaksSec) {
        const x = timeToX(p, tMax, w);
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
        ctx.stroke();
      }
    }

    function drawDroppedMarkers(ctx, win, tMax, w, h) {
      ctx.fillStyle = "#e06060";
      for (const d of win.droppedCandidates) {
        const x = timeToX(d.timeSec, tMax, w);
        ctx.beginPath();
        ctx.arc(x, h - 6, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawFocusMarker(ctx, win, tMax, w, h) {
      if (win.focusSec === null || win.focusSec === undefined) return;
      const x = timeToX(win.focusSec, tMax, w);
      if (x < 0 || x > w) return;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, h);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawWaveform(ctx, win, w, h) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);
      const tMax = win.waveformDuration || 1;
      drawMarginZones(ctx, win, tMax, w, h);
      drawChunkZones(ctx, win, tMax, w, h);

      const data = win.waveform;
      const absMax = Math.max(...data.map(Math.abs)) || 1;
      ctx.strokeStyle = "#c8d0e0";
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = (i / data.length) * w;
        const y = h / 2 - (data[i] / absMax) * (h / 2 - 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      drawDroppedMarkers(ctx, win, tMax, w, h);
      drawFocusMarker(ctx, win, tMax, w, h);
    }

    function drawEnergy(ctx, win, w, h) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);
      const tMax = win.frameTimes[win.frameTimes.length - 1] || 1;
      drawMarginZones(ctx, win, tMax, w, h);
      drawChunkZones(ctx, win, tMax, w, h);

      const energy = win.energy;
      const thr = win.localThreshold;
      const yMax = Math.max(...energy) || 1;

      function plot(data, color, lw) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.beginPath();
        for (let i = 0; i < data.length; i++) {
          const x = timeToX(win.frameTimes[i], tMax, w);
          const y = h - (data[i] / yMax) * (h - 6) - 3;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      plot(thr, "#f0c040", 1);
      plot(energy, "#00d2a0", 1.2);
      drawDroppedMarkers(ctx, win, tMax, w, h);
      drawFocusMarker(ctx, win, tMax, w, h);

      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.font = "9px monospace";
      ctx.fillText(`max=${fmt(yMax, 4)}`, 2, 10);
    }

    function drawSilenceMask(ctx, win, w, h) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);
      const tMax = win.frameTimes[win.frameTimes.length - 1] || 1;
      drawMarginZones(ctx, win, tMax, w, h);
      drawChunkZones(ctx, win, tMax, w, h);

      const data = win.silenceMask;
      ctx.fillStyle = "rgba(240,192,64,0.35)";
      for (let i = 0; i < data.length; i++) {
        if (data[i] > 0.5) {
          const x = timeToX(win.frameTimes[i], tMax, w);
          const xw = Math.max(1, w / data.length);
          ctx.fillRect(x, 0, xw, h);
        }
      }
      drawDroppedMarkers(ctx, win, tMax, w, h);
      drawFocusMarker(ctx, win, tMax, w, h);

      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.font = "9px monospace";
      ctx.fillText("silent", 2, 10);
    }

    function drawSpectrogram(ctx, win, w, h) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);
      const { data, nFreq, nTime } = win.spectrogram;
      const cellW = w / nTime;
      const cellH = h / nFreq;

      for (let f = 0; f < nFreq; f++) {
        for (let t = 0; t < nTime; t++) {
          const v = data[f * nTime + t];
          if (v < 0.05) continue;
          const intensity = Math.pow(v, 0.6);
          ctx.fillStyle = `rgba(${Math.round(180 * intensity)},${Math.round(200 * intensity)},${Math.round(255 * intensity)},${0.3 + intensity * 0.7})`;
          ctx.fillRect(t * cellW, (nFreq - 1 - f) * cellH, Math.ceil(cellW), Math.ceil(cellH));
        }
      }

      const tMax = win.waveformDuration || 1;
      drawChunkZones(ctx, win, tMax, w, h);
      drawFocusMarker(ctx, win, tMax, w, h);
    }

    // ── Audio players ──────────────────────────────────
    const audioA = new Audio(`data:audio/wav;base64,${A.audioBase64}`);
    const audioB = new Audio(`data:audio/wav;base64,${B.audioBase64}`);
    const playheadsA = [];
    const playheadsB = [];

    function buildAudioPlayer(win, side) {
      const audio = side === "a" ? audioA : audioB;
      const colorClass = side === "a" ? "side-a" : "side-b";

      const player = document.createElement("div");
      player.className = `audio-player ${colorClass}`;

      const labelEl = document.createElement("div");
      labelEl.className = "audio-label";
      labelEl.textContent = `${win.label} — ${win.channel} — ${win.waveformDuration.toFixed(2)}s affichées`;
      player.appendChild(labelEl);

      const row = document.createElement("div");
      row.className = "audio-player-row";

      const btn = document.createElement("button");
      btn.className = "play-btn";
      btn.textContent = "▶";

      const seekBar = document.createElement("input");
      seekBar.type = "range";
      seekBar.className = "seek-bar";
      seekBar.min = 0; seekBar.max = 1000; seekBar.value = 0; seekBar.step = 1;

      const timeDisplay = document.createElement("div");
      timeDisplay.className = "time-display";
      timeDisplay.textContent = "0.00s / —";

      row.appendChild(btn);
      row.appendChild(seekBar);
      row.appendChild(timeDisplay);
      player.appendChild(row);

      function syncUI() {
        const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
        const playheads = side === "a" ? playheadsA : playheadsB;
        for (const ph of playheads) {
          ph.style.left = (ratio * 100) + "%";
          ph.style.display = "block";
        }
        seekBar.value = Math.round(ratio * 1000);
        timeDisplay.textContent =
          `${audio.currentTime.toFixed(2)}s / ${(audio.duration || 0).toFixed(2)}s`;
      }

      audio.addEventListener("timeupdate", syncUI);
      audio.addEventListener("loadedmetadata", () => {
        timeDisplay.textContent = `0.00s / ${audio.duration.toFixed(2)}s`;
      });
      audio.addEventListener("ended", () => { btn.textContent = "▶"; });

      btn.addEventListener("click", () => {
        if (audio.paused) { audio.play(); btn.textContent = "⏸"; }
        else { audio.pause(); btn.textContent = "▶"; }
      });

      seekBar.addEventListener("input", () => {
        if (audio.duration) {
          audio.currentTime = (seekBar.value / 1000) * audio.duration;
          syncUI();
        }
      });

      return player;
    }

    const audioSection = document.getElementById("audio-section");
    audioSection.appendChild(buildAudioPlayer(A, "a"));
    audioSection.appendChild(buildAudioPlayer(B, "b"));

    // ── Build all chart rows ───────────────────────────
    const chartsEl = document.getElementById("charts-section");

    function addChartRow(title, drawFn, clickToSeek = false) {
      const row = document.createElement("div");
      row.className = "chart-row";
      // Attach the row before measuring: grid column width is determined by
      // the CSS grid track (1fr), not by content, so this is stable even
      // before any container/canvas is added.
      chartsEl.appendChild(row);

      for (const [win, side] of [[A, "a"], [B, "b"]]) {
        const container = document.createElement("div");
        container.className = `chart-container side-${side}`;
        container.innerHTML = `<h4><span class="side-label">${side === "a" ? "A" : "B"}</span> — ${title}</h4>`;
        row.appendChild(container);

        // Size the canvas to the container's actual rendered width so the
        // playhead/seek math (which uses the wrapper's real bounding box)
        // lines up with what's drawn — a canvas is otherwise inline-styled
        // to a fixed pixel width while its wrapper stretches to fill the
        // grid column, desyncing "% along the audio" from "% along the chart".
        const cs = getComputedStyle(container);
        const paddingX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
        const cw = Math.max(200, Math.round(container.clientWidth - paddingX));
        const ch = title.includes("Spectrogramme") ? SPEC_H : CHART_H;
        const { canvas, ctx, w, h } = createCanvas(cw, ch);
        drawFn(ctx, win, w, h);

        const wrapper = document.createElement("div");
        wrapper.className = "canvas-wrapper";
        wrapper.appendChild(canvas);

        const playhead = document.createElement("div");
        playhead.className = "playhead";
        wrapper.appendChild(playhead);

        if (side === "a") playheadsA.push(playhead);
        else playheadsB.push(playhead);

        if (clickToSeek) {
          const audio = side === "a" ? audioA : audioB;
          function seek(e) {
            if (!audio.duration) return;
            const rect = wrapper.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            audio.currentTime = ratio * audio.duration;
          }
          let dragging = false;
          wrapper.addEventListener("mousedown", (e) => { dragging = true; seek(e); });
          window.addEventListener("mousemove", (e) => { if (dragging) seek(e); });
          window.addEventListener("mouseup", () => { dragging = false; });
        }

        container.appendChild(wrapper);
      }
    }

    addChartRow("Forme d'onde + chunks", drawWaveform, true);
    addChartRow("Spectrogramme + frontières", drawSpectrogram);
    addChartRow("Énergie (RMS) + seuil de silence local", drawEnergy);
    addChartRow("Masque de silence", drawSilenceMask);

    // ── Tables: candidates + chunks ─────────────────────
    function buildCandidatesTable(win) {
      const rows = win.regionCandidates
        .slice()
        .sort((a, b) => a.timeSec - b.timeSec)
        .map((rc) => {
          const dropped = win.droppedCandidates.find((d) => Math.abs(d.timeSec - rc.timeSec) < 1e-6);
          const cls = rc.accepted ? "row-accepted" : "row-dropped";
          const note = dropped ? `blocked by t=${fmt(dropped.blockedByTimeSec, 2)}s` : (rc.accepted ? "kept" : "");
          return `<tr class="${cls}"><td>${fmt(rc.timeSec, 2)}s</td><td>${fmt(rc.energy, 5)}</td><td>${rc.accepted ? "✓" : "✗"}</td><td>${note}</td></tr>`;
        })
        .join("");
      return `<div class="table-card">
        <h4>Pics candidats (${win.label})</h4>
        <table>
          <thead><tr><th>t</th><th>energy</th><th>kept</th><th>note</th></tr></thead>
          <tbody>${rows || "<tr><td colspan=4>—</td></tr>"}</tbody>
        </table>
      </div>`;
    }

    function buildChunksTable(win) {
      const rows = win.chunks
        .map((c) => `<tr><td>${fmt(c.startSec, 2)}→${fmt(c.endSec, 2)}</td><td>${fmt(c.duration, 2)}s</td><td>${fmt(c.energyMean, 4)}</td><td>${fmt(c.spectralCentroid, 0)}Hz</td><td>${c.nPeaks}/${c.nPairs}</td></tr>`)
        .join("");
      return `<div class="table-card">
        <h4>Chunks produits (${win.label})</h4>
        <table>
          <thead><tr><th>rel. t</th><th>dur</th><th>energy</th><th>centroid</th><th>peaks/pairs</th></tr></thead>
          <tbody>${rows || "<tr><td colspan=5>—</td></tr>"}</tbody>
        </table>
      </div>`;
    }

    document.getElementById("tables-section").innerHTML =
      buildChunksTable(A) + buildChunksTable(B) + buildCandidatesTable(A) + buildCandidatesTable(B);

    // ── Params section ─────────────────────────────────
    const paramsEl = document.getElementById("params-section");
    let paramsHtml = `<details><summary>Paramètres ChunkCreator</summary><div class="params-grid">`;
    for (const [k, v] of Object.entries(PARAMS)) {
      paramsHtml += `<div>${k}: <span>${v}</span></div>`;
    }
    paramsHtml += `</div></details>`;
    paramsEl.innerHTML = paramsHtml;
  </script>
</body>
</html>
