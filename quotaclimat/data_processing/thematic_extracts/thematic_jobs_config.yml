### Configuration of the thematic extract jobs (thematic_keywords.py and thematic_articles.py)
### One entry per thematic (the THEMATIC env variable), with:
### - periodes: [country][list of periods] to extract, one id per period.
###     - country: one of the COUNTRIES keys of the jobs (france, belgium, belgium_flanders)
###     - id: [a-z0-9_], written in the period column of the destination table
###     - start (included) / end (excluded): YYYY-MM-DD, unquoted
###     - periods of a country must not overlap
###     - every period goes into one table per media and country: {thematic}_keywords_{country}, {thematic}_articles_{country}
###     - adding a period: MODE=resume. Changing the dates or id of an ingested period: MODE=reset
### - keywords: [language][audiovisuel|presse] keywords to look for
###     - audiovisuel: exact match on public.keywords.keywords_with_timestamp (spelling and accents as in that column)
###     - presse: whole expressions searched in factiva title, snippet and body, after normalization on both sides
###       (lower, French accents and œ/æ removed, apostrophes and hyphen replaced by a space)

incendies:
  periodes:
    france:
      - id: ete_2025
        start: 2025-07-01
        end: 2025-09-01
      - id: ete_2026
