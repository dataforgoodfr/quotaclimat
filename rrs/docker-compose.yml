services:
  rrs_db:
    image: postgres:15
    ports:
      - 5434:5432
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rrs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      TZ: Europe/Paris
      POSTGRES_USER: user
      POSTGRES_DB: rrs_db
      POSTGRES_PASSWORD: password
    logging:
      driver: none

  migrate:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["alembic", "-c", "rrs/alembic.ini", "upgrade", "head"]
    environment:
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
    depends_on:
      rrs_db:
        condition: service_healthy

  upsert_subjects:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.dictionary.upsert_subjects"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
    depends_on:
      migrate:
        condition: service_completed_successfully

  upsert_dictionary:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.dictionary.upsert_dictionary"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
    depends_on:
      upsert_subjects:
        condition: service_completed_successfully

  import_segments:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.keyword_detection.import_segments"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barometre}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      BUCKET_NAME: ${BUCKET_NAME}
    depends_on:
      rrs_db:
        condition: service_healthy

  filter_keywords:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.keyword_detection.filter_keywords"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barometre}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      BUCKET_NAME: ${BUCKET_NAME}
      SUBJECT: ${SUBJECT:-environmental_health}
      START_DATE: ${START_DATE:-}
      END_DATE: ${END_DATE:-}
    depends_on:
      upsert_subjects:
        condition: service_completed_successfully

  export_segments:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.keyword_detection.export_segments"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      BUCKET: ${BUCKET}
      BUCKET_SECRET: ${BUCKET_SECRET}
      BUCKET_NAME: ${BUCKET_NAME}
      SUBJECT: ${SUBJECT:-environmental_health}
      N_KEYWORDS: ${N_KEYWORDS:-1}
      START_DATE: ${START_DATE:-}
      END_DATE: ${END_DATE:-}
      OUTPUT_PATH: ${OUTPUT_PATH:-/app/output/segments_export.csv}
    volumes:
      - ./output:/app/output
    depends_on:
      rrs_db:
        condition: service_healthy

  build_embeddings:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.rag.build_embeddings"]
    environment:
      PYTHONPATH: /app
      EMBEDDINGS_BUCKET: ${RRS_BUCKET}
      EMBEDDINGS_BUCKET_SECRET: ${RRS_BUCKET_SECRET}
      EMBEDDINGS_BUCKET_NAME: ${RAG_BUCKET_NAME}
      SUBJECT: ${SUBJECT:-environmental_health}
      S3_PREFIX: ${RAG_S3_PREFIX:-expert_models}
      EMBEDDER: ${EMBEDDER:-mistral}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      CHUNK_CHARS: ${CHUNK_CHARS:-600}
      MIN_CHUNK_CHARS: ${MIN_CHUNK_CHARS:-150}
      OVERLAP_CHARS: ${OVERLAP_CHARS:-100}
      BATCH_SIZE: ${BATCH_SIZE:-32}
      STOP_AFTER_KEYWORD: ${STOP_AFTER_KEYWORD:-}
      FORCE_REBUILD: ${FORCE_REBUILD:-}

  rag:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.rag.run_rag_agent_mistral"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      BUCKET: ${BUCKET}
      BUCKET_SECRET: ${BUCKET_SECRET}
      BUCKET_NAME: ${BUCKET_NAME}
      EMBEDDINGS_BUCKET: ${RRS_BUCKET}
      EMBEDDINGS_BUCKET_SECRET: ${RRS_BUCKET_SECRET}
      EMBEDDINGS_BUCKET_NAME: ${RAG_BUCKET_NAME}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-2603}
      SUBJECT: ${SUBJECT:-environmental_health}
      S3_PREFIX: ${RAG_S3_PREFIX:-expert_models}
      TOP_K: ${TOP_K:-5}
      MAX_TOOL_CHARS: ${MAX_TOOL_CHARS:-2400}
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-3}
      CONCURRENCY: ${CONCURRENCY:-10}
      START_DATE: ${START_DATE:-}
      END_DATE: ${END_DATE:-}
      DAYS_PRIOR: ${DAYS_PRIOR:-1}
      OUTPUT_PATH: ${OUTPUT_PATH:-}
      TRACE_PATH: ${TRACE_PATH:-}
      ONLY_FLAGGED: ${ONLY_FLAGGED:-true}
      LIMIT: ${LIMIT:-}
    volumes:
      - ./output:/app/output
    depends_on:
      rrs_db:
        condition: service_healthy

  import_cases:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.keyword_detection.import_cases"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barometre}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      rrs_db:
        condition: service_healthy

  analyse_keywords:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.keyword_detection.analyse_keywords"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      BUCKET: ${BUCKET}
      BUCKET_SECRET: ${BUCKET_SECRET}
      BUCKET_NAME: ${BUCKET_NAME}
      SUBJECT: ${SUBJECT:-insecurity}
      START_DATE: ${START_DATE:-}
      END_DATE: ${END_DATE:-}
      DAYS_PRIOR: ${DAYS_PRIOR:-1}
    depends_on:
      upsert_dictionary:
        condition: service_completed_successfully

  detect_misinformation:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.misinformation_detection.main"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      BUCKET: ${BUCKET}
      BUCKET_SECRET: ${BUCKET_SECRET}
      BUCKET_NAME: ${BUCKET_NAME}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      SUBJECT: ${SUBJECT:-insecurity}
      START_DATE: ${START_DATE:-}
      END_DATE: ${END_DATE:-}
      DAYS_PRIOR: ${DAYS_PRIOR:-1}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-2603}
      CONCURRENCY: ${CONCURRENCY:-10}
      OUTPUT_PATH: ${OUTPUT_PATH:-}
    # depends_on:
    #   analyse_keywords:
    #     condition: service_completed_successfully

  clustering:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["python", "-m", "rrs.clustering.main"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SUBJECT: ${SUBJECT:-insecurity}
      SPACY_MODEL: fr_core_news_sm
      WINDOW_SIZE: 3
      OVERLAP_TOKENS: 30
      PROVIDER: anthropic
      MAX_CONCURRENT_REQUESTS: 5
      # INITIAL_LABELS_FILE: ./labels # overrides seed labels
      # NO_SEEDS: 0
      # SKIP_MERGE: 0
      MERGE_BATCH_SIZE: 30
      MERGE_MAX_ROUNDS: 5
      TARGET_CLUSTERS: 5 # Overrides adaptive cluster selection
      MIN_CLUSTERS: 7
      MAX_CLUSTERS: 150
      CLUSTER_SCALE: 1.0
      LOW_THRESHOLD: 0.4
      HIGH_THRESHOLD: 0.85
      EMBEDDING_BACKEND: mistral
      #EMBEDDING_MODEL: "dangvantuan/sentence-camembert-large" # ignored if backend == mistral
      EXPIRY_DAYS: 30
      OUTPUT_DIR: /app/output
      START_DATE: ${START_DATE:-}
      END_DATE: ${END_DATE:-}
      DAYS_PRIOR: ${DAYS_PRIOR:-}
    depends_on:
      rrs_db:
        condition: service_healthy

  pulsar:
    build:
      context: ../
      dockerfile: rrs/Dockerfile.pulsar
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      SUBJECT: ${SUBJECT:-climate}
      PULSAR_EMAIL: ${PULSAR_EMAIL}
      PULSAR_PASSWORD: ${PULSAR_PASSWORD}
      PULSAR_SEARCH_ID: ${PULSAR_SEARCH_ID:-201823}
      PULSAR_FOLDER_ID: ${PULSAR_FOLDER_ID:-529}
      PULSAR_API_KEY: ${PULSAR_API_KEY}
      PULSAR_BASE_URL: ${PULSAR_BASE_URL:-}
      PULSAR_TOP_N: ${PULSAR_TOP_N:-30}
      PULSAR_DAYS_BACK: ${PULSAR_DAYS_BACK:-1}
      PULSAR_START_DATE: ${PULSAR_START_DATE:-}
      PULSAR_END_DATE: ${PULSAR_END_DATE:-}
      PULSAR_RELEVANCE_MENTION_TAG_IDS: ${PULSAR_RELEVANCE_MENTION_TAG_IDS:-[]}
      CONCURRENCY: ${CONCURRENCY:-5}
    depends_on:
      rrs_db:
        condition: service_healthy

  pulsar_export_posts:
    build:
      context: ../
      dockerfile: rrs/Dockerfile.pulsar
    entrypoint: ["python", "-m", "rrs.pulsar.export_posts"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
      SUBJECT: ${SUBJECT:-climate}
      PULSAR_API_KEY: ${PULSAR_API_KEY}
      PULSAR_START_DATE: ${PULSAR_START_DATE}
      PULSAR_END_DATE: ${PULSAR_END_DATE}
      PULSAR_PAGE_LIMIT: ${PULSAR_PAGE_LIMIT:-100}
      PULSAR_PARENT_LOOKBACK_DAYS: ${PULSAR_PARENT_LOOKBACK_DAYS:-30}
      PULSAR_EXPORT_DIR: rrs/exports/pulsar
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./exports/pulsar:/app/rrs/exports/pulsar
    tty: true
    depends_on:
      rrs_db:
        condition: service_healthy

  console:
    build:
      context: ../
      dockerfile: rrs/Dockerfile
    entrypoint: ["sleep", "12000"]
    environment:
      PYTHONPATH: /app
      RRS_PG_USER: ${RRS_PG_USER:-user}
      RRS_PG_DATABASE: ${RRS_PG_DATABASE:-rrs_db}
      RRS_PG_PASSWORD: ${RRS_PG_PASSWORD:-password}
      RRS_PG_HOST: ${RRS_PG_HOST:-rrs_db}
      RRS_PG_PORT: ${RRS_PG_PORT:-5432}
    volumes:
      - ../rrs/:/app/rrs/
    tty: true
    depends_on:
      rrs_db:
        condition: service_healthy
